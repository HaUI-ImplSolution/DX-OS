name: CI AI
on:
  push:
    branches:
      - main
      - Khuong/main
    paths:
      - 'ai/**'
      - 'data/**'
      - '.github/workflows/ci-ai.yml'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main
    paths:
      - 'ai/**'
      - 'data/**'
      - '.github/workflows/ci-ai.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements*.txt

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
