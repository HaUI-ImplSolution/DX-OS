# The store on its own. Connecting it to DX-OS adds two lines to the service, see README.md:
#     env_file: .env
#     extra_hosts: ["host.docker.internal:host-gateway"]
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - appliance-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  appliance-data:
