server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Photos are no longer served from here; never answer with the app shell for them.
  location /uploads/ {
    return 404;
  }

  # The page is revalidated on every visit so a new build shows up; hashed assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
