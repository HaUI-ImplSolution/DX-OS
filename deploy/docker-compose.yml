# SPDX-License-Identifier: Apache-2.0
# DX-OS stack: the shared core and the model-driven service.
# Every ${VAR:?} must be set in deploy/.env (copy .env.example); Compose stops and names the
# missing variable.
# Published ports: the gateway (apisix) and Postgres.
# Everything else is reached through the gateway.

# Rotates the container logs so they cannot fill the disk; `docker compose logs` reads them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# For containers that run as a normal user and need no Linux capability: nothing can gain more
# privileges than it started with.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

services:
  # ---------------------------------------------------------------------------
  # Data and storage
  # ---------------------------------------------------------------------------
  postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      <<: *postgres-env
      # Password of the Keycloak role, created by postgres/init when the data directory is new.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - ${POSTGRES_DATA_DIR:?}:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object store for photos and attachments (SeaweedFS). Master, volume server, filer
  # and S3 gateway run in one process; the filer has no HTTP interface, so objects are reachable
  # only through the S3 API with the keys below.
  seaweedfs:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    # -v=-1 logs warnings and errors only, leaving out the lock ring's info lines every 30 seconds;
    # -v=0 shows info logs.
    command: ["-logtostderr=true", "-v=-1", "server", "-ip=seaweedfs", "-dir=/data", "-s3",
      "-filer.disableHttp", "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      # Filer gRPC (user and policy management, S3 STS) accepts only callers signed with this key.
      WEED_JWT_FILER_SIGNING_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - ./data/seaweedfs:/data
    # No published port: photos are read through presigned links, the admin page through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Backend, web and portal
  # ---------------------------------------------------------------------------
  backend:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-backend:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_PORT: 8081
      # File storage
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      STORAGE_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-15m}
      # Keycloak admin client (creates the client and roles of a model, manages users)
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      # Virus scan of uploads: the host of clamd (service clamav, profile av); empty turns it off
      STORAGE_SCAN_HOST: ${STORAGE_SCAN_HOST:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Password of the read-only role for reports, created when a model is applied
      ENGINE_REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?}
      # Test only: fails a decision after the process step, to show both changes roll back
      ENGINE_FAULT_AFTER_DECISION: ${ENGINE_FAULT_AFTER_DECISION:-false}
    # No published port: clients reach the API through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-frontend:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Served by the gateway on the same origin as the API and Keycloak, so both stay empty.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: ""
        VITE_KEYCLOAK_CLIENT_ID: dxos-web
    depends_on:
      - backend
    # No published port: the gateway serves the web app.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  portal:
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-portal:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../portal
      dockerfile: Dockerfile
    # No published port: the gateway serves the portal under /portal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Virus scan of every upload before it is stored. Off by default (about 1 GB of RAM); start it
  # with COMPOSE_PROFILES=av and STORAGE_SCAN_HOST=clamav in deploy/.env. The signatures are kept
  # in a volume, and clamd answers no scan for about 10 seconds each time it reloads them.
  clamav:
    profiles:
      - av
    logging: *default-logging
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    restart: unless-stopped
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_TemporaryDirectory: /tmp
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - clamav_data:/var/lib/clamav
    # No published port: only the backend reaches clamd.

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  keycloak:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-sso:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../sso
      dockerfile: Dockerfile
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the placeholders of realm-dxos.json at import time.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      STAFF_OTP_FLOW: ${STAFF_OTP_FLOW:-DISABLED}
    volumes:
      - ../sso/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
    # No published port: the gateway routes /realms, /resources and /admin to it.
    # The health endpoint is probed over bash on the management port.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  # Creates the Postgres roles and schema of the monitoring service and the view of Keycloak
  # sign-in events it reads (idempotent, see monitor-init.sh). It waits for the backend (audit_log)
  # and Keycloak (event_entity) because each creates its own tables.
  monitor-init:
    logging: *default-logging
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
    volumes:
      - ./monitor-init.sh:/monitor-init.sh:ro
    entrypoint: ["bash", "/monitor-init.sh"]

  # Receives the unusual requests of the gateway, probes the services and serves the screen of
  # administrators under /monitor. It runs apart from the backend so it works when the backend is down.
  monitor:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-monitor:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: monitor
    restart: unless-stopped
    depends_on:
      monitor-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      # Alerts go to the administrators' channel when a webhook is set.
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL_ADMIN: ${MATTERMOST_WEBHOOK_URL_ADMIN:-}
    # No published port: the gateway forwards /monitor, and delivers its own events straight to it.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/monitor/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------------------------
  # Builds the gateway routes: apisix/common.yaml with the delivery key of the monitor filled in.
  apisix-config:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    environment:
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
    command:
      - sh
      - -c
      - >-
        sed "s|__MONITOR_INGEST_KEY__|$$MONITOR_INGEST_KEY|g" /src/common.yaml > /out/apisix.yaml &&
        echo '#END' >> /out/apisix.yaml
    volumes:
      - ./apisix:/src:ro
      - ./data/apisix:/out

  apisix:
    # The access log is the traffic record, so it keeps more history than the other services.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: apache/apisix:3.11.0-debian@sha256:178d1f79c2c39834f50213bf6ace90284f6b985dc8189cc50f3666d9fb1037ad
    restart: unless-stopped
    depends_on:
      apisix-config:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      frontend:
        condition: service_healthy
      portal:
        condition: service_healthy
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./data/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_HOST_PORT:?}:9080"
    healthcheck:
      # The image has no curl; any answer below 500 on the web route means the gateway serves.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET / HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -qE 'HTTP/1\.[01] [234]'
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  clamav_data:
