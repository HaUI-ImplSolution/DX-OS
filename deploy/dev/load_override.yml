# Pins the whole stack to the first N cores and caps the memory of every service, so one machine
# can stand for a smaller one when measuring with load_test.py. Used on a throwaway stack:
#   LOAD_CPUSET=0-3 docker compose -p dxscratch -f docker-compose.yml -f dev/load_override.yml \
#     up -d --force-recreate
# LOAD_CPUSET is a cpuset such as 0-3 (four cores); the memory variables default to the values below.
services:
  postgres:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_POSTGRES:-1g}
  seaweedfs:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_SEAWEEDFS:-512m}
  backend:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_BACKEND:-1g}
  frontend:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_FRONTEND:-64m}
  portal:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_PORTAL:-64m}
  keycloak:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_KEYCLOAK:-1g}
  monitor:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_MONITOR:-512m}
  apisix:
    cpuset: ${LOAD_CPUSET:?}
    mem_limit: ${LOAD_MEM_APISIX:-512m}
