# The store, apart from DX-OS. env_file and extra_hosts are the two lines that connect it to DX-OS;
# .env is written by dxos connect and setup steps in README.md.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appliance-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  appliance-data:
