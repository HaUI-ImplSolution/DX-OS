services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=dxfarm
      - POSTGRES_USER=dxfarm
      - POSTGRES_PASSWORD=dxfarm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxfarm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
