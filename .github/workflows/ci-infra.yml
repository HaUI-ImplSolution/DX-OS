name: CI Infra
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml --redact

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fill every blank variable of .env.example with a placeholder
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' deploy/.env.example > deploy/.env

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Compose must stop when a secret is missing
        run: |
          sed -E 's/^(KEYCLOAK_DB_PASSWORD)=.*$/\1=/' deploy/.env > deploy/.env.missing
          if docker compose --env-file deploy/.env.missing -f deploy/docker-compose.yml config --quiet 2> compose-error.log; then
            echo "compose accepted an empty KEYCLOAK_DB_PASSWORD"; exit 1
          fi
          grep -q KEYCLOAK_DB_PASSWORD compose-error.log
