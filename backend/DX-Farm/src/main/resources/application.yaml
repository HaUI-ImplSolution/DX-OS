spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: DX-Farm

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS
    time-zone: Asia/Ho_Chi_Minh

  security:
    oauth2:
      resourceserver:
        jwt:
          # Hostname nội bộ, không dùng issuer-uri - xem sso/README.md.
          jwk-set-uri: http://keycloak:8080/realms/dxfarm/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8081}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

keycloak:
  db:
    # Mật khẩu role Postgres riêng của Keycloak.
    password: ${KEYCLOAK_DB_PASSWORD:keycloak_demo_only}

superset:
  readonly:
    # Mật khẩu role Postgres chỉ-đọc cho BI dashboard. Xem SupersetReadOnlyRoleSeeder.
    password: ${SUPERSET_RO_PASSWORD:superset_demo}

mattermost:
  db:
    # Mật khẩu role Postgres riêng của Mattermost. Xem MattermostDatabaseSeeder.
    password: ${MATTERMOST_DB_PASSWORD:mattermost_demo}

logging:
  level:
    HaUI.ImplSolution.DX_Farm: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
