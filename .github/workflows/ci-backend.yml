# SPDX-License-Identifier: Apache-2.0
name: Backend
on:
  push:
    branches:
      - main
      - Khuong/main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test the backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Code Formatting
        run: mvn -T 2C --batch-mode spotless:check

      # Persistence tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Build and Test
        run: mvn --batch-mode verify
