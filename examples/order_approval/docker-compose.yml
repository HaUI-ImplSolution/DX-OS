# The application of this example; replace it with your own image and keep env_file and extra_hosts.
# The .env file next to this one is written by dxos connect, see README.md.
services:
  app:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: python /app/app.py
    volumes:
      - ./app.py:/app/app.py:ro
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
