<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DX-Farm Mobile Prototype</title>
<style>
  :root {
    --bg: #f4f6f3; --surface: #fff; --border: #dfe4dc; --text: #1f2a1c; --muted: #667066;
    --primary: #2e7d32; --primary-dark: #1b5e20; --warning: #b26a00; --danger: #b3261e;
    --chip-neutral: #eceeea; --chip-warning: #fdf0dc; --chip-success: #e3f1e4; --chip-danger: #fbe6e4;
    --stage: #dfe4dc;
  }
  @media (prefers-color-scheme: dark) { :root { --stage: #10140f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); max-width: 390px; }
  .toolbar select, .toolbar button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .phone { width: 100%; max-width: 390px; height: 780px; max-height: calc(100vh - 90px); background: var(--bg); border-radius: 28px;
    border: 8px solid #1f2a1c; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .appbar { height: 56px; flex: none; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; }
  .appbar h1 { font-size: 20px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 48px; height: 48px; border: 0; background: none; font-size: 22px; border-radius: 24px; color: var(--text); cursor: pointer; }
  .screen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: left; font: inherit; color: inherit; width: 100%; }
  button.card { cursor: pointer; }
  .card h2 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .btn { height: 56px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font: inherit; font-size: 17px; font-weight: 600; color: var(--text); cursor: pointer; width: 100%; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip.neutral { background: var(--chip-neutral); color: var(--muted); }
  .chip.warning { background: var(--chip-warning); color: var(--warning); }
  .chip.success { background: var(--chip-success); color: var(--primary-dark); }
  .chip.danger { background: var(--chip-danger); color: var(--danger); }
  .banner { background: var(--chip-warning); color: var(--warning); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15px; }
  .banner.queue { background: var(--chip-neutral); color: var(--text); cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .thumb { aspect-ratio: 1; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .fab { position: absolute; right: 16px; bottom: 16px; width: 64px; height: 64px; border-radius: 32px; border: 0; background: var(--primary); color: #fff; font-size: 28px; box-shadow: 0 4px 12px rgba(0,0,0,.25); cursor: pointer; }
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 24px; background: var(--primary); color: #fff; font-size: 44px; display: flex; align-items: center; justify-content: center; }
  .photo { width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 10px; align-items: center; font-size: 16px; }
  .dot { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--border); flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; }
  .step.done .dot { background: var(--primary); border-color: var(--primary); }
  .step.bad .dot { background: var(--danger); border-color: var(--danger); }
  .step.todo { color: var(--muted); }
  .progress { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }
  .skeleton { height: 78px; border-radius: 12px; background: var(--border); opacity: .6; }
  .error { color: var(--danger); font-size: 15px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 4px 0; }
  .kv span:first-child { color: var(--muted); }
</style>
</head>
<body>
<div class="toolbar">
  <span>Prototype (dữ liệu giả)</span>
  <label>Trạng thái báo cáo
    <select id="statusSel">
      <option value="none">Chờ chẩn đoán</option>
      <option value="PENDING">Chờ kỹ sư duyệt</option>
      <option value="APPROVED" selected>Đã duyệt</option>
      <option value="REJECTED">Cần chụp lại</option>
    </select>
  </label>
  <label>Dữ liệu
    <select id="dataSel">
      <option value="ok">Bình thường</option>
      <option value="loading">Đang tải</option>
      <option value="empty">Rỗng</option>
      <option value="error">Lỗi</option>
    </select>
  </label>
  <label><input type="checkbox" id="queueChk"> Có hàng đợi offline</label>
  <button id="restart">Về đầu</button>
</div>
<div class="phone">
  <div class="appbar" id="appbar"></div>
  <div class="screen" id="screen"></div>
  <button class="fab" id="fab" hidden aria-label="Chụp ảnh">📷</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const parcels = [
  { code: "TD-01", area: 1.2, place: "Ấp 3, Cần Thơ", isolated: true },
  { code: "TD-02", area: 0.8, place: "Ấp 5, Cần Thơ", isolated: false },
];
const reports = [
  { id: 12, day: "28/09", color: "#c9d6a8" },
  { id: 11, day: "24/09", color: "#d8c9a0" },
  { id: 10, day: "20/09", color: "#b7cfa3" },
];
let stack = [];
let sending = false;

const statusInfo = () => {
  const s = $("statusSel").value;
  return {
    none: { chip: "neutral", label: "Chờ chẩn đoán" },
    PENDING: { chip: "warning", label: "Chờ kỹ sư duyệt" },
    APPROVED: { chip: "success", label: "Đã duyệt" },
    REJECTED: { chip: "danger", label: "Cần chụp lại" },
  }[s];
};
const chip = (i) => `<span class="chip ${i.chip}">${i.label}</span>`;
const dataMode = () => $("dataSel").value;

function go(name, params) { stack.push({ name, params }); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function bar(title, opts = {}) {
  $("appbar").innerHTML =
    (opts.back ? `<button class="iconbtn" data-act="back" aria-label="Quay lại">←</button>` : `<span style="width:12px"></span>`) +
    `<h1>${title}</h1>` + (opts.profile ? `<button class="iconbtn" data-act="profile" aria-label="Hồ sơ">👤</button>` : "");
}
function guard(html) {
  const m = dataMode();
  if (m === "loading") return `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  if (m === "error") return `<div class="card"><div class="error">Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.</div></div><button class="btn" data-act="reload">Thử lại</button>`;
  return html();
}

const views = {
  login() {
    bar("DX-Farm");
    return `<div class="hero"><div class="logo">🌾</div><div><h2 style="margin:0">DX-Farm</h2><p class="muted">Báo cáo sâu bệnh cho nông dân</p></div></div>
      <button class="btn primary" data-act="login">Đăng nhập</button>
      <button class="btn" data-act="wrongrole" style="height:44px;font-size:14px">Thử đăng nhập bằng tài khoản kỹ sư</button>`;
  },
  wrongrole() {
    bar("DX-Farm");
    return `<div class="hero"><div class="logo" style="background:var(--danger)">!</div><p>Ứng dụng này dành cho nông dân.</p></div><button class="btn" data-act="restart">Quay lại</button>`;
  },
  parcels() {
    bar("Thửa của tôi", { profile: true });
    return guard(() => dataMode() === "empty"
      ? `<div class="empty">Bạn chưa có thửa ruộng nào.<br>Liên hệ hợp tác xã để được thêm thửa.</div>`
      : parcels.map((p) => `<button class="card" data-act="parcel" data-code="${p.code}">
          <h2>${p.code} ${p.isolated ? `<span class="chip warning">Đang cách ly</span>` : ""}</h2>
          <div class="muted">${p.area} ha · ${p.place}</div></button>`).join(""));
  },
  seasons({ code }) {
    bar(code, { back: true });
    const p = parcels.find((x) => x.code === code);
    return guard(() => dataMode() === "empty" ? `<div class="empty">Thửa này chưa có vụ mùa.</div>` :
      (p.isolated ? `<div class="banner">Chưa được thu hoạch: còn 9 ngày (đến 08/10/2026). Thuốc: Tricyclazole.</div>` : "") +
      `<button class="card" data-act="season" data-code="${code}" style="border-color:var(--primary)">
        <h2>Vụ Thu Đông 2026 <span class="chip success">Đang canh tác</span></h2>
        <div class="muted">Giống ST25 · bắt đầu 01/08 · dự kiến thu hoạch 10/11</div></button>
      <div class="card" style="opacity:.6"><h2>Vụ Hè Thu 2026</h2><div class="muted">Giống OM18 · đã thu hoạch 20/07</div></div>`);
  },
  reports({ code }) {
    bar("Báo cáo · " + code, { back: true });
    $("fab").hidden = false;
    return guard(() => (($("queueChk").checked) ? `<div class="banner queue" data-act="profile">Chờ gửi (2) — chạm để xem</div>` : "") +
      (dataMode() === "empty"
        ? `<div class="empty">Chưa có báo cáo nào.<br>Chụp ảnh lá hoặc thân cây bị bệnh để gửi.</div>`
        : `<div class="grid">${reports.map((r, i) => `<button class="card" data-act="report" data-id="${r.id}" style="padding:8px">
            <div class="thumb" style="background:${r.color}">🍃</div>
            <div class="muted">${r.day}</div>${chip(i === 0 ? statusInfo() : { chip: "success", label: "Đã duyệt" })}</button>`).join("")}</div>`));
  },
  capture({ retake }) {
    bar(retake ? "Chụp lại" : "Chụp và gửi", { back: !sending });
    return `<div class="photo" style="background:#c9d6a8">🍃</div>
      <p class="muted" style="margin:0">Ảnh rõ nét, thấy rõ vết bệnh?</p>
      <div class="progress" ${sending ? "" : "hidden"}><i id="bar"></i></div>
      <div id="sendErr" class="error" hidden>Không gửi được. Ảnh đã lưu, sẽ tự gửi khi có mạng.</div>
      <div style="flex:1"></div>
      <div class="row"><button class="btn" data-act="back" ${sending ? "disabled" : ""}>Chụp lại</button>
      <button class="btn primary" data-act="send" ${sending ? "disabled" : ""}>${sending ? "Đang gửi…" : "Gửi báo cáo"}</button></div>`;
  },
  detail() {
    bar("Báo cáo #12", { back: true });
    const s = $("statusSel").value;
    const step = (cls, txt) => `<div class="step ${cls}"><span class="dot">${cls === "done" ? "✓" : cls === "bad" ? "!" : ""}</span>${txt}</div>`;
    const timeline = `<div class="card timeline">
      ${step("done", "Đã gửi · 28/09 07:42")}
      ${step(s === "none" ? "todo" : "done", s === "none" ? "Đang chờ chẩn đoán" : "Đã chẩn đoán")}
      ${step(s === "APPROVED" ? "done" : s === "REJECTED" ? "bad" : "todo", s === "APPROVED" ? "Kỹ sư đã duyệt" : s === "REJECTED" ? "Kỹ sư yêu cầu chụp lại" : "Kỹ sư đang xem xét")}</div>`;
    let result = "";
    if (s === "APPROVED") result = `<div class="card"><h2>Bệnh đạo ôn lá</h2>
      <p style="margin:4px 0 10px">Phun thuốc theo đúng liều, không phun khi trời sắp mưa. Kiểm tra lại ruộng sau 5 ngày.</p>
      <div class="kv"><span>Thuốc</span><span>Tricyclazole</span></div>
      <div class="kv"><span>Liều</span><span>0,6–0,8 kg/ha</span></div>
      <div class="kv"><span>Số ngày cách ly</span><span>14 ngày</span></div>
      <p class="muted" style="margin:8px 0 0">Việc ghi nhận phun thuốc do kỹ sư thực hiện.</p></div>`;
    if (s === "REJECTED") result = `<div class="card"><h2 class="error" style="margin:0 0 4px">Cần chụp lại</h2><p style="margin:0">Ảnh bị mờ, chụp lại gần vết bệnh hơn.</p></div>`;
    return `<div class="photo" style="background:#c9d6a8">🍃</div>${timeline}${result}` +
      (s === "REJECTED" ? `<button class="btn primary" data-act="retake">Chụp lại</button>` : "");
  },
  profile() {
    bar("Hồ sơ", { back: true });
    const q = $("queueChk").checked ? `<div class="card"><h2>Chờ gửi (2)</h2>
      <div class="kv"><span>TD-01 · 28/09 06:10</span><span class="chip neutral">Đang chờ</span></div>
      <div class="kv"><span>TD-01 · 28/09 06:12</span><span class="chip danger">Lỗi</span></div>
      <button class="btn danger" style="height:44px;margin-top:8px" data-act="dropitem">Xoá mục lỗi</button></div>` : "";
    return `<div class="card"><h2>Nguyễn Văn Nông</h2><div class="muted">Nông dân · phiên bản 0.1.0</div></div>${q}
      <div style="flex:1"></div><button class="btn danger" data-act="logout">Đăng xuất</button>`;
  },
};

function render() {
  $("fab").hidden = true;
  const { name, params } = stack[stack.length - 1];
  $("screen").innerHTML = views[name](params || {});
}

function send() {
  sending = true; render();
  const barEl = $("bar"); let w = 0;
  const t = setInterval(() => {
    w += 20; barEl.style.width = w + "%";
    if (w >= 100) {
      clearInterval(t); sending = false;
      if ($("dataSel").value === "error") { render(); $("sendErr").hidden = false; return; }
      stack = stack.filter((s) => s.name !== "capture"); render();
    }
  }, 150);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const cur = stack[stack.length - 1];
  const a = el.dataset.act;
  if (a === "login") { stack = [{ name: "parcels" }]; render(); }
  else if (a === "wrongrole") go("wrongrole");
  else if (a === "restart") { stack = [{ name: "login" }]; render(); }
  else if (a === "back") back();
  else if (a === "profile") go("profile");
  else if (a === "parcel") go("seasons", { code: el.dataset.code });
  else if (a === "season") go("reports", { code: el.dataset.code });
  else if (a === "report") go("detail");
  else if (a === "retake") go("capture", { retake: true });
  else if (a === "send") send();
  else if (a === "reload") { $("dataSel").value = "ok"; render(); }
  else if (a === "logout") { if (confirm("Đăng xuất khỏi ứng dụng?")) { stack = [{ name: "login" }]; render(); } }
  else if (a === "dropitem") { if (confirm("Xoá mục lỗi này?")) { $("queueChk").checked = false; render(); } }
});
$("fab").addEventListener("click", () => go("capture", {}));
$("restart").addEventListener("click", () => { stack = [{ name: "login" }]; render(); });
["statusSel", "dataSel", "queueChk"].forEach((id) => $(id).addEventListener("change", render));
stack = [{ name: "login" }]; render();
</script>
</body>
</html>
