name: Assistant

# Checks of the business assistant: its service, its SBOM, its Compose services and its gateway route.
on:
  push:
    branches:
      - main
      - Khuong/main
    paths:
      - 'assistant/**'
      - 'tools/classifier/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/assistant-sso.sh'
      - 'sbom/assistant.cdx.json'
      - '.github/workflows/ci-assistant.yml'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main
    paths:
      - 'assistant/**'
      - 'tools/classifier/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/assistant-sso.sh'
      - 'sbom/assistant.cdx.json'
      - '.github/workflows/ci-assistant.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  service:
    name: Test the assistant
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: assistant/package-lock.json

      - name: Build and test
        working-directory: assistant
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm test

      - name: The SBOM matches the lockfile and every license in it is allowed
        run: |
          (cd assistant && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "$RUNNER_TEMP/assistant.cdx.json")
          python3 .github/scripts/check_sbom_fresh.py sbom sbom/assistant.cdx.json "$RUNNER_TEMP/assistant.cdx.json"
          python3 .github/scripts/check_licenses.py sbom "$RUNNER_TEMP/assistant.cdx.json"

  stack:
    name: Validate assistant Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill every blank variable of .env.example with a placeholder
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' deploy/.env.example > deploy/.env

      - name: The Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: The gateway renders the routes in every mode
        run: |
          for mode in full core; do
            for admin in false true; do
              args=(--mode "$mode")
              if [[ "$admin" == true ]]; then args+=(--admin-console); fi
              python3 e2e/api/check_routes.py "${args[@]}"
            done
          done
