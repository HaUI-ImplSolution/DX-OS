# Optional business assistant, loaded only when deploy/.env sets
# COMPOSE_FILE=docker-compose.yml:docker-compose.assistant.yml (see assistant/README.md).
# Its settings are in deploy/assistant.env (copy assistant.env.example), never in deploy/.env.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The assistant runs on an internal network: it reaches Core, the identity service and the gateway,
# and the inference endpoint only through assistant-egress.
networks:
  assistant:
    internal: true

services:
  apisix-config:
    environment:
      DXOS_ASSISTANT: "true"

  apisix:
    networks: [default, assistant]

  backend:
    networks: [default, assistant]

  keycloak:
    networks: [default, assistant]

  # Prepares the state directory and the keys of the assistant.
  assistant-init:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-assistant:${DXOS_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: assistant/Dockerfile
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    network_mode: none
    read_only: true
    command: [dist/setup.js, prepare, /bootstrap]
    environment:
      ASSISTANT_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
    volumes:
      - ./data/assistant:/bootstrap
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]

  # Registers the sign-in client of the assistant; a failure is only a warning, Core is not affected.
  assistant-sso:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-sso:${DXOS_IMAGE_TAG:-local}
    read_only: true
    depends_on:
      assistant-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    volumes:
      - ./assistant-sso.sh:/assistant-sso.sh:ro
      - ./data/assistant/sso:/bootstrap:ro
    entrypoint: [bash, -c, "bash /assistant-sso.sh || echo 'WARNING: the assistant sign-in client was not set up; Core is not affected.' >&2"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777"]

  # The only way out of the assistant network: a forward proxy that reaches the host and port of ASSISTANT_INFERENCE_URL and nothing else.
  assistant-egress:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-assistant:${DXOS_IMAGE_TAG:-local}
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    # An inference service on this machine is reached as host.docker.internal.
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, assistant]
    env_file:
      - path: ./assistant.env
        required: false
    command: [dist/egress.js]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    healthcheck:
      test: [CMD, node, -e, "require('node:net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4

  assistant-control:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-assistant:${DXOS_IMAGE_TAG:-local}
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [assistant]
    depends_on:
      assistant-egress:
        condition: service_healthy
      backend:
        condition: service_healthy
      assistant-init:
        condition: service_completed_successfully
      assistant-sso:
        condition: service_completed_successfully
    env_file:
      - path: ./assistant.env
        required: false
    environment:
      ASSISTANT_HOST: 0.0.0.0
      ASSISTANT_PORT: 18790
      ASSISTANT_STATE_DIR: /state
      ASSISTANT_MASTER_KEY_FILE: /run/secrets/master.key
      ASSISTANT_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      ASSISTANT_CORE_URL: http://backend:8081
      ASSISTANT_OIDC_ISSUER: ${GATEWAY_PUBLIC_URL:?}/realms/dxos
      ASSISTANT_OIDC_AUDIENCE: dxos-api
      ASSISTANT_CORE_AUDIENCE: dxos-api
      ASSISTANT_OIDC_JWKS_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/certs
      ASSISTANT_OIDC_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      ASSISTANT_OIDC_CLIENT_ID: dxos-assistant
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://assistant-egress:3128
      HTTPS_PROXY: http://assistant-egress:3128
      NO_PROXY: backend,keycloak,localhost,127.0.0.1
    volumes:
      - ./data/assistant/control:/state
      - ./data/assistant/private:/run/secrets:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
