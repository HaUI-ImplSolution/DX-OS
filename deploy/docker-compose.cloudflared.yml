# Optional overlay that publishes the stack through a Cloudflare Tunnel, so the server opens no port.
# Enable it in deploy/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.cloudflared.yml
#   CLOUDFLARE_TUNNEL_TOKEN=<token of the tunnel>
# Tunnel public hostname: apisix:9080 (app, Keycloak, portal).
# Set GATEWAY_PUBLIC_URL to that hostname before the first start; Keycloak imports its redirect URIs
# only once.
# The tunnel hostname needs a Request Header Transform Rule that sets X-Forwarded-Port to 443,
# otherwise the gateway forwards its listener port and the backend builds wrong origins.
# Every long-running service restarts with Docker, so the stack comes back after a server reboot.
# The gateway reads the client address from CF-Connecting-IP (apisix/config.yaml).
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  keycloak:
    restart: unless-stopped
    environment:
      KC_HOSTNAME: ${GATEWAY_PUBLIC_URL:?}
      # Login events record the client address the gateway forwards in X-Forwarded-For.
      KC_PROXY_HEADERS: xforwarded

  # Behind an HTTPS front the backend needs X-Forwarded-* to see the public origin, or every
  # write request fails the CORS origin check.
  backend:
    restart: unless-stopped
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  postgres:
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  portal:
    restart: unless-stopped
