services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dxfarm}
      POSTGRES_USER: ${POSTGRES_USER:-dxfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxfarm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxfarm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend/DX-Farm
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dxfarm}
      POSTGRES_USER: ${POSTGRES_USER:-dxfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxfarm}
      SERVER_PORT: 8081
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
