version: 2

# One pull request per ecosystem and run, grouped, aimed at Khuong/main.
# The AI Python packages are left out: ai/requirements.lock pins the image, so it is refreshed by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: Khuong/main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    target-branch: Khuong/main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      mobile:
        update-types: [minor, patch]

  # Base images of the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /ai
      - /ai/evaluation
      - /backend
      - /frontend
      - /minio
      - /portal
      - /sso
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]
