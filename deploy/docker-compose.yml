x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-dxfarm}
  POSTGRES_USER: ${POSTGRES_USER:-dxfarm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxfarm}

x-ai-build: &ai-build
  context: ../ai
  dockerfile: Dockerfile

x-ai-common-env: &ai-common-env
  EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  HF_HOME: /app/weights/huggingface

x-mattermost-volumes: &mattermost-volumes
  - ./data/mattermost/config:/mattermost/config
  - ./data/mattermost/data:/mattermost/data
  - ./data/mattermost/logs:/mattermost/logs
  - ./data/mattermost/plugins:/mattermost/plugins
  - ./data/mattermost/client-plugins:/mattermost/client/plugins
  - ./data/mattermost/bleve-indexes:/mattermost/bleve-indexes

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      <<: *postgres-env
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxfarm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend/DX-Farm
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_PORT: 8081
      UPLOAD_DIR: /app/uploads
      SUPERSET_RO_PASSWORD: ${SUPERSET_READONLY_DB_PASSWORD:-superset_ro_demo_only}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD:-mattermost_demo_only}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_demo_only}
      AI_VECTOR_DB_RO_PASSWORD: ${AI_VECTOR_DB_READONLY_PASSWORD:-ai_vector_ro_demo_only}
      AI_VECTOR_DB_INGEST_PASSWORD: ${AI_VECTOR_DB_INGEST_PASSWORD:-ai_vector_ingest_demo_only}
      APP_PUBLIC_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8081}
      AI_SERVICE_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:-}
      AI_SERVICE_CONNECT_TIMEOUT_MS: ${BACKEND_TO_AI_CONNECT_TIMEOUT_MS:-3000}
      AI_SERVICE_READ_TIMEOUT_MS: ${BACKEND_TO_AI_READ_TIMEOUT_MS:-120000}
      AI_SERVICE_INBOUND_API_KEY: ${AI_TO_BACKEND_API_KEY:-}
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]

  ai:
    build:
      <<: *ai-build
    depends_on:
      rag-ingest:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      <<: *ai-common-env
      # Role/database dx_farm_ai_vector_db do backend tự tạo lúc khởi động (AiVectorDatabaseSeeder) -
      # chỉ chứa documents/document_chunks, tách biệt hoàn toàn khỏi CSDL nghiệp vụ của Backend.
      DATABASE_URL: postgresql+psycopg://ai_vector_ro:${AI_VECTOR_DB_READONLY_PASSWORD:-ai_vector_ro_demo_only}@postgres:5432/dx_farm_ai_vector_db
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8081}
      BACKEND_SERVICE_API_KEY: ${AI_TO_BACKEND_API_KEY:-}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      CV_DEVICE: ${AI_CV_DEVICE:-cpu}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    volumes:
      - ${AI_DATA_DIR:-../data}:/data:ro
      - ai_weights:/app/weights
    ports:
      - "${AI_HOST_PORT:-8000}:8000"

  rag-ingest:
    build:
      <<: *ai-build
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *ai-common-env
      RAG_INGEST_DATABASE_URL: postgresql+psycopg://ai_vector_ingest:${AI_VECTOR_DB_INGEST_PASSWORD:-ai_vector_ingest_demo_only}@postgres:5432/dx_farm_ai_vector_db
    volumes:
      - ${AI_DATA_DIR:-../data}:/data:ro
      - ai_weights:/app/weights
    command: ["python", "-m", "scripts.ingest_diseases"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Cùng-origin qua nginx nên để trống; Keycloak đi thẳng cổng expose ra host.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/dxfarm
        VITE_KEYCLOAK_CLIENT_ID: dxfarm-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8082}:80"

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_HOST_PORT:-8090}:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Healthcheck của backend chỉ xác nhận app đã lên, không đảm bảo role/database do các
    # CommandLineRunner seeder tạo xong (Tomcat nhận request trước khi seeder chạy xong) -
    # tự thử lại nếu lần đầu connect Postgres thất bại.
    restart: on-failure
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_demo_only}
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_HOST_PORT:-8180}}"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../sso/realm-dxfarm.json:/opt/keycloak/data/import/realm-dxfarm.json:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"

  superset:
    image: apache/superset:3.1.3
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@dxfarm.local}
      DXFARM_DB_URI: postgresql+psycopg2://superset_ro:${SUPERSET_READONLY_DB_PASSWORD:-superset_ro_demo_only}@postgres:5432/${POSTGRES_DB:-dxfarm}
      KEYCLOAK_SUPERSET_CLIENT_ID: ${SUPERSET_OIDC_CLIENT_ID:-dxfarm-superset}
      KEYCLOAK_SUPERSET_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET:-dxfarm_superset_demo_secret}
    volumes:
      - ../bi/bootstrap.sh:/app/pythonpath/bootstrap.sh:ro
      - ../bi/bootstrap_datasources.py:/app/pythonpath/bootstrap_datasources.py:ro
      - ../bi/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../bi/dxfarm_dashboard_export.zip:/app/pythonpath/dxfarm_dashboard_export.zip:ro
      - ./data/superset:/app/superset_home
    entrypoint: ["/bin/bash", "/app/pythonpath/bootstrap.sh"]
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"

  # Container Mattermost chạy bằng user không phải root (uid 2000) nhưng bind mount mới tạo lần
  # đầu thuộc root — service tạm này chown lại một lần trước khi Mattermost khởi động, để
  # `docker compose up` chạy được ngay không cần thao tác tay.
  mattermost-init:
    image: alpine:3.20
    command:
      ["chown", "-R", "2000:2000", "/mattermost/config", "/mattermost/data", "/mattermost/logs",
        "/mattermost/plugins", "/mattermost/client/plugins", "/mattermost/bleve-indexes"]
    volumes: *mattermost-volumes

  mattermost:
    image: mattermost/mattermost-team-edition:10.5
    # `depends_on: backend` (service_healthy) chỉ đảm bảo app đã lên, không đảm bảo role/database
    # `mattermost` đã tạo xong (CommandLineRunner seeder chạy sau khi Tomcat đã nhận request) -
    # tự thử lại nếu lần đầu connect Postgres thất bại.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      mattermost-init:
        condition: service_completed_successfully
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost_app:${MATTERMOST_DB_PASSWORD:-mattermost_demo_only}@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:${MATTERMOST_HOST_PORT:-8065}"
    volumes: *mattermost-volumes
    ports:
      - "${MATTERMOST_HOST_PORT:-8065}:8065"

volumes:
  ai_weights:
  ollama_models:
