# SPDX-License-Identifier: Apache-2.0
# Copy to .github/workflows/ of the model repository. It needs no DX-OS machine and no secret: a runner of GitHub
# reads every model file with dxos-lint.jar of a DX-OS release and fails the job when a file has problems.
# Set DXOS_VERSION to the tag of a release that carries dxos-lint.jar.
name: Lint the model files

on:
  pull_request:
    paths:
      - 'models/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      DXOS_VERSION: vX.Y.Z
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download dxos-lint.jar and check its checksum
        run: |
          base="https://github.com/HaUI-ImplSolution/DX-OS/releases/download/${DXOS_VERSION}"
          curl -fsSLO "$base/dxos-lint.jar"
          curl -fsSL "$base/dx-os-${DXOS_VERSION#v}.sha256" | grep ' dxos-lint.jar$' | sha256sum -c -

      - name: Lint every model file
        run: |
          shopt -s nullglob
          files=(models/*.yaml models/*.yml)
          (( ${#files[@]} )) || { echo "No model files in models/"; exit 0; }
          java -jar dxos-lint.jar "${files[@]}"
