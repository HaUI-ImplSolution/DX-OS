version: 2

# Dependabot knows version numbers and nothing else: not the license of a new version, not whether a line is
# still supported, not whether the project still works with it. So it opens pull requests for minor and patch
# updates only, and a new major version, a new runtime line or a change of base image is decided by hand
# (license in .github/licenses/component-catalog.json, support line, compatibility, then the checks in docs/TESTING.md).
# A new release must also be old enough before it is proposed (except for the Compose images): a week for a patch and
# two weeks for a minor, so that a yanked or hijacked release is gone, and the first fixes of a new minor are out, before it arrives.
# Every pull request still has to pass Check licenses, Check SBOMs against lockfiles and Check upstream licenses.
#
# GitHub reads this file from the default branch (main); updates are aimed at Khuong/main.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: Khuong/main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    target-branch: Khuong/main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    # Spring Boot, Flowable and the other libraries change their API between majors.
    # A new Spring Boot minor changes defaults and the libraries it manages, so it is moved by hand with the checks of
    # docs/TESTING.md; its patch updates come from the bot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-minor"]
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]
        update-types: [patch]
      backend:
        update-types: [minor, patch]
        exclude-patterns: ["org.springframework.boot:*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    # React, React Router, Vite and TypeScript majors are migrations of the interface, not updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react-admin:
        patterns: ["react-admin", "ra-*"]
        update-types: [minor, patch]
      frontend:
        update-types: [minor, patch]
        exclude-patterns: ["react-admin", "ra-*"]

  - package-ecosystem: npm
    directory: /website
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      website:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e/web
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e:
        update-types: [minor, patch]

  # Base images of the Dockerfiles: Java 21 and Node 22 are the long-term-support lines the project builds on,
  # and nginx follows its stable line (even minor numbers), so only their patch updates and new digests come.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /portal
      - /sso
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  # Images of the third-party services in the Compose file.
  # A new PostgreSQL major version cannot open the data directory of the old one, and the other services change
  # their configuration between majors; those upgrades are done by hand.
  # The gateway changes its configuration between minor versions too, and Python is the runtime line of the MQTT
  # bridge, so both take patch updates only.
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache/apisix"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      compose-images:
        patterns: ["*"]

  # The assistant (Node 24 image and npm packages): delete both entries below with assistant/.
  - package-ecosystem: docker
    directory: /assistant
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      assistant-base-image:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /assistant
    target-branch: Khuong/main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-minor-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      assistant:
        update-types: [minor, patch]
