name: Rerun

# Runs the failed jobs of a finished workflow run again, twice at most, when every failed job failed on a network or
# quota error of a service it downloads from (.github/scripts/transient_errors.txt), such as Maven Central or the
# GitHub API. A run with any other failure is left as it is.
# It only reads the logs and calls the API, and never checks out the code of a pull request.
# GitHub starts a workflow_run workflow only from the default branch, so this one takes effect once it is on main.
on:
  workflow_run:
    workflows:
      - Backend
      - Frontend
      - Platform
      - Compliance
      - Dependencies
      - Docs
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  rerun:
    name: Rerun transient failures
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the failed jobs again when they failed on a network or quota error
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/rerun_transient.sh "$RUN_ID"
