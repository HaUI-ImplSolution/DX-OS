server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-cache";
  }

  # Public addresses of the services beside the app; an empty value means <page host>:<default port>.
  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    return 200 'window.PORTAL_URLS={"bi":"${PORTAL_BI_URL}","chat":"${PORTAL_CHAT_URL}","storage":"${PORTAL_STORAGE_URL}"};';
  }
}
