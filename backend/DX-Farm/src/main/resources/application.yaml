spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: DX-Farm

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Databases created before Flyway are marked as already being at V1 (the baseline).
    baseline-on-migrate: true
    baseline-version: "1"

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities still match it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      # Seed data (data.sql) runs after the Flyway migrations and before Hibernate validates.
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS
    time-zone: Asia/Ho_Chi_Minh

  security:
    oauth2:
      resourceserver:
        jwt:
          # Hostname nội bộ, không dùng issuer-uri - xem sso/README.md.
          jwk-set-uri: http://keycloak:8080/realms/dxfarm/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8081}

app:
  # Cooperative code opening every generated parcel code (e.g. HTX01-H0042-T03).
  htx-code: ${HTX_CODE:HTX01}
  # A farmer's GPS fix is rejected when its reported error is larger than this (meters).
  gps-max-accuracy-meters: ${GPS_MAX_ACCURACY_METERS:30}
  # Requests a farmer may have waiting for a decision at the same time.
  max-pending-requests: ${MAX_PENDING_REQUESTS:3}
  # Cron (Asia/Ho_Chi_Minh) of the daily reminder for seasons that reached their expected harvest date.
  harvest-reminder-cron: ${HARVEST_REMINDER_CRON:0 0 7 * * *}
  # Start months (1-12) that suggest a season type. Self-compiled, not yet confirmed by an
  # agronomist; months outside every list make the farmer pick the type.
  season-start-months:
    dong-xuan: ${SEASON_MONTHS_DONG_XUAN:11,12,1}
    he-thu: ${SEASON_MONTHS_HE_THU:3,4,5}
    thu-dong: ${SEASON_MONTHS_THU_DONG:6,7,8}

storage:
  # S3-compatible object storage (MinIO); the bucket is private.
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  # Origin of the gateway, used to sign links when no request is being served.
  public-url: ${STORAGE_PUBLIC_URL}
  presign-ttl: ${STORAGE_PRESIGN_TTL:15m}

security:
  jwt:
    # Access tokens must carry this audience (added by the dxfarm-api client scope in Keycloak).
    audience: ${JWT_AUDIENCE:dxfarm-api}
  # Keycloak clients a FARMER-only token may come from (comma separated). Farmers use the mobile
  # app only.
  farmer-client-ids: ${FARMER_CLIENT_IDS:dxfarm-mobile}

keycloak:
  admin:
    # Service account (client credentials) used to create household accounts.
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak:8080}
    realm: dxfarm
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  db:
    # Mật khẩu role Postgres riêng của Keycloak.
    password: ${KEYCLOAK_DB_PASSWORD}

superset:
  readonly:
    # Mật khẩu role Postgres chỉ-đọc cho BI dashboard. Xem SupersetReadOnlyRoleSeeder.
    password: ${SUPERSET_RO_PASSWORD}

mattermost:
  db:
    # Mật khẩu role Postgres riêng của Mattermost. Xem MattermostDatabaseSeeder.
    password: ${MATTERMOST_DB_PASSWORD}
  webhook:
    # Empty disables notifications. Internal hostname, e.g. http://mattermost:8065/hooks/<key>.
    url: ${MATTERMOST_WEBHOOK_URL:}
    # Own channel for new parcel and crop season requests; empty falls back to the default url.
    url-admin: ${MATTERMOST_WEBHOOK_URL_ADMIN:}
    # Own channel for new reports and pending diagnoses; empty falls back to the default url.
    url-engineer: ${MATTERMOST_WEBHOOK_URL_ENGINEER:}
    # Browser-reachable gateway origin used to attach the report photo; empty omits the image.
    image-base-url: ${MATTERMOST_IMAGE_BASE_URL:}
    connect-timeout-ms: ${MATTERMOST_WEBHOOK_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${MATTERMOST_WEBHOOK_READ_TIMEOUT_MS:3000}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://ai:8000}
    # Service token/API key nội bộ cho chiều Backend -> AI
    api-key: ${AI_SERVICE_API_KEY}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:120000}
    # Service API key nội bộ cho chiều AI -> Backend (/internal/v1/**, header X-Service-Api-Key).
    inbound-api-key: ${AI_SERVICE_INBOUND_API_KEY}
  vector-db:
    readonly:
      # Mật khẩu role Postgres chỉ-đọc (ai_vector_ro) cho AI runtime. Xem AiVectorDatabaseSeeder.
      password: ${AI_VECTOR_DB_RO_PASSWORD}
    ingest:
      # Mật khẩu role Postgres đọc/ghi (ai_vector_ingest) cho job ingest RAG. Xem AiVectorDatabaseSeeder.
      password: ${AI_VECTOR_DB_INGEST_PASSWORD}

resilience4j:
  circuitbreaker:
    instances:
      aiDiagnosis:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  level:
    # INFO unless LOG_LEVEL_APP overrides it (set DEBUG for local development).
    HaUI.ImplSolution.DX_Farm: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
