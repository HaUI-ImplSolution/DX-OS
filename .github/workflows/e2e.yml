name: E2E
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &stack-paths
      - 'backend/**'
      - 'frontend/**'
      - 'ai/**'
      - 'sso/**'
      - 'portal/**'
      - 'deploy/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches:
      - main
      - Khuong/main
    paths: *stack-paths

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f docker-compose.yml -f demo/docker-compose.e2e.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pillow

      - name: Create deploy/.env
        run: python3 deploy/demo/make_ci_env.py

      - name: Download and verify crop classifier
        run: python3 ai/scripts/download_crop_classifier.py

      - name: Start the reduced stack
        working-directory: deploy
        run: $COMPOSE up -d --build --wait --wait-timeout 1500 postgres minio keycloak backend ai frontend portal apisix

      - name: Seed demo data
        run: python3 deploy/demo/seed_demo.py

      - name: Add the CI treatment rule
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          $COMPOSE exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 < demo/ci_fixture_rule.sql

      - name: Run E2E
        run: python3 deploy/demo/e2e.py --require-rule

      - name: Service logs
        if: failure()
        working-directory: deploy
        run: $COMPOSE logs --tail 200

      - name: Stop the stack
        if: always()
        working-directory: deploy
        run: $COMPOSE down -v
