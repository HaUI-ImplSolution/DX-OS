name: CI Infra
on:
  push:
    branches:
      - main
      - Khuong/main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml --redact

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fill every blank variable of .env.example with a placeholder
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' deploy/.env.example > deploy/.env

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Compose must stop when a secret is missing
        run: |
          sed -E 's/^(KEYCLOAK_DB_PASSWORD)=.*$/\1=/' deploy/.env > deploy/.env.missing
          if docker compose --env-file deploy/.env.missing -f deploy/docker-compose.yml config --quiet 2> compose-error.log; then
            echo "compose accepted an empty KEYCLOAK_DB_PASSWORD"; exit 1
          fi
          grep -q KEYCLOAK_DB_PASSWORD compose-error.log

      - name: Compose is valid for every app
        run: |
          for app in farm lab; do
            DXOS_APP=$app docker compose -f deploy/docker-compose.yml config --quiet
          done

  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: The gateway file of every app is valid and has routes
        run: |
          for app in farm lab; do
            cat deploy/apisix/common.yaml deploy/apisix/apps/$app.yaml > "$RUNNER_TEMP/apisix.$app.yaml"
            python3 - "$RUNNER_TEMP/apisix.$app.yaml" <<'PY'
          import sys
          import yaml

          config = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          ids = [route["id"] for route in config["routes"]]
          assert len(ids) == len(set(ids)), f"duplicate route ids: {ids}"
          assert {upstream["id"] for upstream in config["upstreams"]} >= {
              route["upstream_id"] for route in config["routes"] if "upstream_id" in route}
          PY
          done

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Dashboard bundle and chart query contexts
        working-directory: ./bi
        run: python -m unittest test_chart_query_context -v
