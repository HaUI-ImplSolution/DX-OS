spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: DX-Farm

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS
    time-zone: Asia/Ho_Chi_Minh

  security:
    oauth2:
      resourceserver:
        jwt:
          # Hostname nội bộ, không dùng issuer-uri - xem sso/README.md.
          jwk-set-uri: http://keycloak:8080/realms/dxfarm/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT:8081}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Base URL nội bộ để build image_url gửi cho AI Service (ảnh phục vụ qua /uploads/**).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://backend:8081}

keycloak:
  db:
    # Mật khẩu role Postgres riêng của Keycloak.
    password: ${KEYCLOAK_DB_PASSWORD:keycloak_demo_only}

superset:
  readonly:
    # Mật khẩu role Postgres chỉ-đọc cho BI dashboard. Xem SupersetReadOnlyRoleSeeder.
    password: ${SUPERSET_RO_PASSWORD:superset_demo}

mattermost:
  db:
    # Mật khẩu role Postgres riêng của Mattermost. Xem MattermostDatabaseSeeder.
    password: ${MATTERMOST_DB_PASSWORD:mattermost_demo}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://ai:8000}
    # Service token/API key nội bộ cho chiều Backend -> AI
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:120000}
    # Service API key nội bộ cho chiều AI -> Backend (/internal/v1/**, header X-Service-Api-Key).
    # Để trống thì ServiceApiKeyAuthenticationFilter không cấp quyền cho ai (fail closed).
    inbound-api-key: ${AI_SERVICE_INBOUND_API_KEY:}
  vector-db:
    readonly:
      # Mật khẩu role Postgres chỉ-đọc (ai_vector_ro) cho AI runtime. Xem AiVectorDatabaseSeeder.
      password: ${AI_VECTOR_DB_RO_PASSWORD:ai_vector_ro_demo_only}
    ingest:
      # Mật khẩu role Postgres đọc/ghi (ai_vector_ingest) cho job ingest RAG. Xem AiVectorDatabaseSeeder.
      password: ${AI_VECTOR_DB_INGEST_PASSWORD:ai_vector_ingest_demo_only}

resilience4j:
  circuitbreaker:
    instances:
      aiDiagnosis:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  level:
    HaUI.ImplSolution.DX_Farm: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
