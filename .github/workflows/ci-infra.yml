# SPDX-License-Identifier: Apache-2.0
name: CI Infra
on:
  push:
    branches:
      - main
      - Khuong/main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan working tree and history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml --redact

  license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Every source file has its license header and every dependency in the SBOMs has an allowed license
        run: python3 .github/scripts/check_licenses.py

  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install a release archive of this commit with the installer of the releases
        run: |
          git archive --format=tar.gz --prefix=dx-os-0.0.0/ -o "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" HEAD
          (cd "$RUNNER_TEMP" && sha256sum dx-os-0.0.0.tar.gz > dx-os-0.0.0.sha256)
          bash deploy/get.sh --file "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" --prefix "$RUNNER_TEMP/dx-os"
          grep -qx 'DXOS_IMAGE_TAG=v0.0.0' "$RUNNER_TEMP/dx-os/deploy/.env"
          grep -qx 'COMPOSE_PROJECT_NAME=dxos' "$RUNNER_TEMP/dx-os/deploy/.env"
          "$HOME/.local/bin/dxos" version
          "$HOME/.local/bin/dxos" help > /dev/null

      - name: A changed archive is refused
        run: |
          echo tampered >> "$RUNNER_TEMP/dx-os-0.0.0.tar.gz"
          if bash deploy/get.sh --file "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" --prefix "$RUNNER_TEMP/other"; then
            echo "the installer accepted an archive that does not match its SHA-256"; exit 1
          fi

      - name: Compose resolves there and every file it mounts was copied
        working-directory: ${{ runner.temp }}/dx-os/deploy
        run: |
          docker compose config --quiet
          docker compose config --format json \
            | jq -r '.services[].volumes[]? | select(.type == "bind") | .source' | sort -u \
            | while read -r source; do
                # deploy/data holds runtime state that Compose creates on first start.
                case "$source" in "$PWD"/data|"$PWD"/data/*) continue ;; esac
                [[ -e "$source" ]] || { echo "not installed: $source"; exit 1; }
              done

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fill every blank variable of .env.example with a placeholder
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' deploy/.env.example > deploy/.env

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Compose must stop when a secret is missing
        run: |
          sed -E 's/^(KEYCLOAK_DB_PASSWORD)=.*$/\1=/' deploy/.env > deploy/.env.missing
          if docker compose --env-file deploy/.env.missing -f deploy/docker-compose.yml config --quiet 2> compose-error.log; then
            echo "compose accepted an empty KEYCLOAK_DB_PASSWORD"; exit 1
          fi
          grep -q KEYCLOAK_DB_PASSWORD compose-error.log

  backup-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create an env file with random secrets
        run: deploy/make_env.sh deploy/.env

      - name: Start Postgres and put some data in it
        working-directory: deploy
        run: |
          # Made before Compose creates deploy/data as root through the Postgres bind mount.
          mkdir -p data/seaweedfs
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U dxos -d dxos -c "CREATE TABLE backup_drill (id int); INSERT INTO backup_drill VALUES (1)"
          # One applied model with its records, as the engine keeps them.
          docker compose exec -T postgres psql -U dxos -d dxos -v ON_ERROR_STOP=1 -c "
            CREATE SCHEMA engine; CREATE TABLE engine.model_version (model text);
            INSERT INTO engine.model_version VALUES ('drill');
            CREATE SCHEMA m_drill; CREATE TABLE m_drill.item (id int); INSERT INTO m_drill.item VALUES (1), (2)"

      - name: Back up
        working-directory: deploy
        run: ./backup.sh

      - name: Restore the backup into a scratch Postgres and check it
        working-directory: deploy
        run: |
          ./backup.sh verify | tee verify.log
          grep -q "Applied models: 1, records in their tables: 2" verify.log

  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: The gateway file is valid and has routes
        run: |
          python3 - deploy/apisix/common.yaml <<'PY'
          import sys
          import yaml

          config = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          ids = [route["id"] for route in config["routes"]]
          assert len(ids) == len(set(ids)), f"duplicate route ids: {ids}"
          assert {upstream["id"] for upstream in config["upstreams"]} >= {
              route["upstream_id"] for route in config["routes"] if "upstream_id" in route}
          PY

      - name: Every route without a token check is on the public list
        run: python3 deploy/apisix/check_routes.py
