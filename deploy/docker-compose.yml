# DX-OS stack: the shared core plus the app chosen by DXOS_APP (farm or lab).
# Every ${VAR:?} must be set in deploy/.env (copy .env.example); Compose stops and names the
# missing variable.
# Published ports: the gateway (apisix), Postgres and Mattermost.
# Everything else is reached through the gateway.

# Rotates the container logs so they cannot fill the disk; `docker compose logs` reads them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

x-ai-build: &ai-build
  context: ../ai
  dockerfile: Dockerfile

x-ai-common-env: &ai-common-env
  EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:?}
  HF_HOME: /app/weights/huggingface

x-mattermost-volumes: &mattermost-volumes
  - ./data/mattermost/config:/mattermost/config
  - ./data/mattermost/data:/mattermost/data
  - ./data/mattermost/logs:/mattermost/logs
  - ./data/mattermost/plugins:/mattermost/plugins
  - ./data/mattermost/client-plugins:/mattermost/client/plugins
  - ./data/mattermost/bleve-indexes:/mattermost/bleve-indexes
  - ./data/mattermost/webhooks:/mattermost/webhooks

services:
  # ---------------------------------------------------------------------------
  # Data and storage
  # ---------------------------------------------------------------------------
  postgres:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    environment:
      <<: *postgres-env
    volumes:
      - ${POSTGRES_DATA_DIR:?}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The official MinIO images are no longer published, so the image is built from source.
  minio:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-minio:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes:
      - ./data/minio:/data
    # No published port: photos are read through presigned links, the console through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Backend, web and portal
  # ---------------------------------------------------------------------------
  backend:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-backend:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_PORT: 8081
      # The app this backend runs; any other value stops the start.
      DXOS_APP: ${DXOS_APP:-farm}
      # Photo storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      STORAGE_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      # Passwords of the Postgres roles the backend creates at startup
      SUPERSET_RO_PASSWORD: ${SUPERSET_READONLY_DB_PASSWORD:?}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      AI_VECTOR_DB_RO_PASSWORD: ${AI_VECTOR_DB_READONLY_PASSWORD:?}
      AI_VECTOR_DB_INGEST_PASSWORD: ${AI_VECTOR_DB_INGEST_PASSWORD:?}
      # AI service, both directions
      AI_SERVICE_BASE_URL: ${AI_BASE_URL:?}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:?}
      AI_SERVICE_CONNECT_TIMEOUT_MS: ${BACKEND_TO_AI_CONNECT_TIMEOUT_MS:?}
      AI_SERVICE_READ_TIMEOUT_MS: ${BACKEND_TO_AI_READ_TIMEOUT_MS:?}
      AI_SERVICE_INBOUND_API_KEY: ${AI_TO_BACKEND_API_KEY:?}
      # Keycloak admin client (creates accounts and the roles of the app)
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      # Chat notifications, both apps; a URL left empty is read from the file mattermost-bootstrap writes
      MATTERMOST_WEBHOOK_DIR: /run/mattermost-webhooks
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL_ADMIN: ${MATTERMOST_WEBHOOK_URL_ADMIN:-}
      MATTERMOST_IMAGE_BASE_URL: ${MATTERMOST_IMAGE_BASE_URL:-}
      MATTERMOST_APP_BASE_URL: ${MATTERMOST_APP_BASE_URL:-}
      # Limits, both apps
      MAX_PENDING_REQUESTS: ${MAX_PENDING_REQUESTS:-3}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.40}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-15m}
      # Farm only
      MATTERMOST_WEBHOOK_URL_ENGINEER: ${MATTERMOST_WEBHOOK_URL_ENGINEER:-}
      HTX_CODE: ${HTX_CODE:-HTX01}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.open-meteo.com}
      GPS_MAX_ACCURACY_METERS: ${GPS_MAX_ACCURACY_METERS:-30}
      HARVEST_REMINDER_CRON: ${HARVEST_REMINDER_CRON:-0 0 7 * * *}
      HARVEST_REMINDER_MAX_DAYS: ${HARVEST_REMINDER_MAX_DAYS:-14}
      TREATMENT_CONFIRMATION_REMINDER_CRON: ${TREATMENT_CONFIRMATION_REMINDER_CRON:-0 0 8 * * *}
      TREATMENT_CONFIRMATION_WAIT_HOURS: ${TREATMENT_CONFIRMATION_WAIT_HOURS:-24}
      # Lab only
      MATTERMOST_WEBHOOK_URL_TECHNICIAN: ${MATTERMOST_WEBHOOK_URL_TECHNICIAN:-}
      LAB_SLA_CHECK_CRON: ${LAB_SLA_CHECK_CRON:-0 */5 * * * *}
      LAB_SLA_WARNING_RATIO: ${LAB_SLA_WARNING_RATIO:-0.8}
      LAB_DEVICE_ALERT_THRESHOLD: ${LAB_DEVICE_ALERT_THRESHOLD:-3}
      LAB_DEVICE_ALERT_WINDOW_DAYS: ${LAB_DEVICE_ALERT_WINDOW_DAYS:-30}
      LAB_LOAN_REMINDER_CRON: ${LAB_LOAN_REMINDER_CRON:-0 0 7 * * *}
      LAB_LOAN_DUE_SOON_DAYS: ${LAB_LOAN_DUE_SOON_DAYS:-1}
    volumes:
      - ./data/mattermost/webhooks:/run/mattermost-webhooks:ro
    # No published port: clients reach the API through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-frontend:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Served by the gateway on the same origin as the API and Keycloak, so both stay empty.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: ""
        VITE_KEYCLOAK_CLIENT_ID: dxos-web
    depends_on:
      - backend
    # No published port: the gateway serves the web app.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  portal:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-portal:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../portal
      dockerfile: Dockerfile
    environment:
      PORTAL_BI_URL: ${PORTAL_BI_URL:-}
      PORTAL_MINIO_URL: ${PORTAL_MINIO_URL:-}
      PORTAL_CHAT_URL: ${PORTAL_CHAT_URL:-}
    # No published port: the gateway serves the portal under /portal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  keycloak:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-sso:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../sso
      dockerfile: Dockerfile
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    # A healthy backend does not mean its seeders have created the Keycloak role and database yet;
    # retry until the first Postgres connection succeeds.
    restart: on-failure
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the placeholders of realm-dxos.json at import time.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:?}
      SUPERSET_OIDC_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
    volumes:
      - ../sso/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
    # No published port: the gateway routes /realms, /resources and /admin to it.
    # The health endpoint is probed over bash on the management port.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  # Creates the Postgres roles and schema of the monitoring service and the view of Keycloak
  # sign-in events it reads (idempotent, see monitor-init.sh). It waits for the backend (audit_log)
  # and Keycloak (event_entity) because each creates its own tables.
  monitor-init:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
    volumes:
      - ./monitor-init.sh:/monitor-init.sh:ro
    entrypoint: ["bash", "/monitor-init.sh"]

  # Receives the unusual requests of the gateway, probes the services and serves the screen of
  # administrators under /monitor. It runs apart from the backend so it works when the backend is down.
  monitor:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-monitor:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: monitor
    restart: unless-stopped
    depends_on:
      monitor-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      # Alerts go to the administrators' channel; a URL left empty is read from the file
      # mattermost-bootstrap writes.
      MATTERMOST_WEBHOOK_DIR: /run/mattermost-webhooks
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL_ADMIN: ${MATTERMOST_WEBHOOK_URL_ADMIN:-}
    volumes:
      - ./data/mattermost/webhooks:/run/mattermost-webhooks:ro
    # No published port: the gateway forwards /monitor, and delivers its own events straight to it.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/monitor/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------------------------
  # Builds the gateway routes of the running app: apisix/common.yaml followed by
  # apisix/apps/<DXOS_APP>.yaml, with the delivery key of the monitor filled in. A value without a
  # file stops here, before the gateway starts.
  apisix-config:
    image: alpine:3.20
    environment:
      DXOS_APP: ${DXOS_APP:-farm}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
    command:
      - sh
      - -c
      - >-
        test -f /src/apps/$$DXOS_APP.yaml ||
        { echo "No gateway routes for DXOS_APP=$$DXOS_APP (apisix/apps/$$DXOS_APP.yaml)" >&2; exit 1; };
        cat /src/common.yaml /src/apps/$$DXOS_APP.yaml |
        sed "s|__MONITOR_INGEST_KEY__|$$MONITOR_INGEST_KEY|g" > /out/apisix.yaml &&
        echo '#END' >> /out/apisix.yaml
    volumes:
      - ./apisix:/src:ro
      - ./data/apisix:/out

  apisix:
    # The access log is the traffic record, so it keeps more history than the other services.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: apache/apisix:3.11.0-debian
    restart: unless-stopped
    depends_on:
      apisix-config:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      frontend:
        condition: service_healthy
      superset:
        condition: service_healthy
      portal:
        condition: service_healthy
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./data/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_HOST_PORT:?}:9080"
      - "${APISIX_SUPERSET_HOST_PORT:?}:9081"
      - "${APISIX_MINIO_HOST_PORT:?}:9082"
    healthcheck:
      # The image has no curl; any answer below 500 on the web route means the gateway serves.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET / HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -qE 'HTTP/1\.[01] [234]'
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # AI: local LLM, knowledge ingest and the AI service
  # ---------------------------------------------------------------------------
  ollama:
    logging: *default-logging
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:?}"]

  # Ingests the knowledge corpus of the app selected by DXOS_APP into its own namespace.
  rag-ingest:
    image: ${DXOS_IMAGE_PREFIX:-dxos}-ai:${DXOS_IMAGE_TAG:-local}
    build:
      <<: *ai-build
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *ai-common-env
      RAG_INGEST_DATABASE_URL: postgresql+psycopg://ai_vector_ingest:${AI_VECTOR_DB_INGEST_PASSWORD:?}@postgres:5432/dxos_ai_vector_db
    volumes:
      - ${AI_DATA_DIR:?}:/data:ro
      - ai_weights:/app/weights
    command: ["python", "-m", "scripts.ingest_diseases", "--corpus", "${DXOS_APP:-farm}"]

  ai:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-ai:${DXOS_IMAGE_TAG:-local}
    build:
      <<: *ai-build
    depends_on:
      rag-ingest:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      <<: *ai-common-env
      # The read-only role and the vector database are created by the backend at startup
      # (AiVectorDatabaseSeeder) and hold documents and chunks only, apart from the business data.
      DATABASE_URL: postgresql+psycopg://ai_vector_ro:${AI_VECTOR_DB_READONLY_PASSWORD:?}@postgres:5432/dxos_ai_vector_db
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?}
      BACKEND_SERVICE_API_KEY: ${AI_TO_BACKEND_API_KEY:?}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:?}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?}
      CV_DEVICE: ${AI_CV_DEVICE:?}
      CV_WEIGHTS_PATH: ${AI_CV_WEIGHTS_PATH:?}
      CV_WEIGHTS_SHA256: ${AI_CV_WEIGHTS_SHA256:?}
      LOG_LEVEL: ${AI_LOG_LEVEL:?}
    volumes:
      - ${AI_DATA_DIR:?}:/data:ro
      - ai_weights:/app/weights
      - type: bind
        source: ${AI_CROP_CLASSIFIER_PATH:-../ai/weights/crop_classifier.onnx}
        target: /app/weights/crop_classifier.onnx
        read_only: true
        bind:
          create_host_path: false
    # No published port: only the backend (and the ingest job) reach the AI service.

  # ---------------------------------------------------------------------------
  # BI: Superset
  # ---------------------------------------------------------------------------
  # Superset runs as uid 1000 but a new bind mount belongs to root; chown it once before it starts.
  superset-init:
    image: alpine:3.20
    command: ["chown", "-R", "1000:1000", "/app/superset_home"]
    volumes:
      - ./data/superset:/app/superset_home

  superset:
    logging: *default-logging
    image: apache/superset:3.1.3
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?}
      # Selects the datasets and the dashboard bundle to register.
      DXOS_APP: ${DXOS_APP:-farm}
      DXOS_DB_URI: postgresql+psycopg2://superset_ro:${SUPERSET_READONLY_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:?}
      KEYCLOAK_SUPERSET_CLIENT_ID: ${SUPERSET_OIDC_CLIENT_ID:?}
      KEYCLOAK_SUPERSET_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET:?}
    volumes:
      - ../bi/bootstrap.sh:/app/pythonpath/bootstrap.sh:ro
      - ../bi/bootstrap_datasources.py:/app/pythonpath/bootstrap_datasources.py:ro
      - ../bi/chart_query_context.py:/app/pythonpath/chart_query_context.py:ro
      - ../bi/grant_engineer_access.py:/app/pythonpath/grant_engineer_access.py:ro
      - ../bi/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../bi/basemap_light.json:/app/superset/static/assets/basemap_light.json:ro
      - ../bi/farm_dashboard_export.zip:/app/pythonpath/farm_dashboard_export.zip:ro
      - ./data/superset:/app/superset_home
    entrypoint: ["/bin/bash", "/app/pythonpath/bootstrap.sh"]
    # The server only starts after the first metadata migration, which takes minutes on an empty volume.
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:$${SUPERSET_PORT}/health\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 900s
    # No published port: the gateway forwards its second listener (APISIX_SUPERSET_HOST_PORT) here.

  # ---------------------------------------------------------------------------
  # Chat: Mattermost
  # ---------------------------------------------------------------------------
  # Mattermost runs as uid 2000 but a new bind mount belongs to root; chown it once before it starts.
  mattermost-init:
    image: alpine:3.20
    command:
      ["chown", "-R", "2000:2000", "/mattermost/config", "/mattermost/data", "/mattermost/logs",
        "/mattermost/plugins", "/mattermost/client/plugins", "/mattermost/bleve-indexes", "/mattermost/webhooks"]
    volumes: *mattermost-volumes

  mattermost:
    logging: *default-logging
    image: mattermost/mattermost-team-edition:10.5
    # A healthy backend does not mean its seeders have created the Mattermost role and database yet;
    # retry until the first Postgres connection succeeds.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      mattermost-init:
        condition: service_completed_successfully
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost_app:${MATTERMOST_DB_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://${PUBLIC_HOST:?}:${MATTERMOST_HOST_PORT:?}"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
    volumes: *mattermost-volumes
    ports:
      - "${MATTERMOST_HOST_PORT:?}:8065"

  # Creates the admin, team, default channels and one incoming webhook per channel once Mattermost is up
  # (idempotent, see chat/bootstrap.sh); the webhook URLs are written to data/mattermost/webhooks.
  mattermost-bootstrap:
    image: mattermost/mattermost-team-edition:10.5
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    restart: on-failure
    depends_on:
      mattermost:
        condition: service_started
    environment:
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_ADMIN_USERNAME: ${MATTERMOST_ADMIN_USERNAME:?}
      MATTERMOST_ADMIN_EMAIL: ${MATTERMOST_ADMIN_EMAIL:?}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD:?}
      WEBHOOKS_DIR: /mattermost/webhooks
    volumes:
      - ../chat/bootstrap.sh:/bootstrap.sh:ro
      - ./data/mattermost/webhooks:/mattermost/webhooks

volumes:
  ai_weights:
  ollama_models:
