services:
  assistant-control:
    image: ${ASSISTANT_IMAGE:?}
    build:
      context: ../assistant
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${ASSISTANT_CONTROL_MEMORY:?}
    cpus: ${ASSISTANT_CONTROL_CPUS:?}
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    environment:
      ASSISTANT_HOST: 0.0.0.0
      ASSISTANT_PORT: 18790
      ASSISTANT_STATE_DIR: /state
      ASSISTANT_MASTER_KEY_FILE: /run/secrets/master.key
      ASSISTANT_RUNTIME_SLOTS_FILE: /run/secrets/slots.json
      ASSISTANT_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      ASSISTANT_CORE_URL: http://backend:8081
      ASSISTANT_OIDC_ISSUER: ${GATEWAY_PUBLIC_URL:?}/realms/dxos
      ASSISTANT_OIDC_AUDIENCE: dxos-api
      ASSISTANT_CORE_AUDIENCE: dxos-api
      ASSISTANT_OIDC_JWKS_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/certs
      ASSISTANT_OIDC_TOKEN_URL: http://keycloak:8080/realms/dxos/protocol/openid-connect/token
      ASSISTANT_OIDC_CLIENT_ID: dxos-assistant
      ASSISTANT_COMPATIBLE_URLS: ${ASSISTANT_COMPATIBLE_URLS:?}
    volumes:
      - ./data/assistant/control:/state
      - ./data/assistant/private/master.key:/run/secrets/master.key:ro
      - ./data/assistant/private/slots.json:/run/secrets/slots.json:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  apisix-config:
    command:
      - sh
      - -c
      - >-
        awk '/^routes:$$/ {print; while ((getline line < "/src/assistant-route.yaml") > 0) print line; next} {print}' /src/common.yaml |
        sed "s|__MONITOR_INGEST_KEY__|$$MONITOR_INGEST_KEY|g" > /out/apisix.yaml &&
        echo '#END' >> /out/apisix.yaml
