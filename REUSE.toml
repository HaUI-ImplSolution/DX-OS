# SPDX-FileCopyrightText: 2026 HaUI-ImplSolution
# SPDX-License-Identifier: Apache-2.0
version = 1
SPDX-PackageName = "DX-OS"
SPDX-PackageDownloadLocation = "https://github.com/HaUI-ImplSolution/DX-OS"

# Every file belongs to the team; a file keeps the SPDX lines it carries and takes the notice from here when it has none.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 HaUI-ImplSolution"
SPDX-License-Identifier = "Apache-2.0"

# Classifier examples and label definitions carry the team's data license.
[[annotations]]
path = ["tools/classifier/labels.json", "tools/classifier/data/seeds/*.jsonl", "tools/classifier/data/negatives.jsonl", "assistant/test/fixtures/classifier.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaUI-ImplSolution"
SPDX-License-Identifier = "CC-BY-4.0"

# Classifier source metadata and model weights carry the project's license.
[[annotations]]
path = ["tools/classifier/data/sources.json", "tools/classifier/model/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaUI-ImplSolution"
SPDX-License-Identifier = "Apache-2.0"

# Maven Wrapper, copied unchanged from Apache Maven.
[[annotations]]
path = ["backend/mvnw", "backend/mvnw.cmd", "backend/.mvn/wrapper/maven-wrapper.properties"]
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Applied by the 2.0.0 release: Flyway checks the checksum of every applied migration, so these files are not edited.
[[annotations]]
path = [
  "backend/dx-core/src/main/resources/db/migration/core/V1__audit_log.sql",
  "backend/dx-core/src/main/resources/db/migration/core/V2__audit_log_target.sql",
  "backend/dx-monitor/src/main/resources/db/migration/monitor/V1__monitor_schema.sql",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaUI-ImplSolution"
SPDX-License-Identifier = "Apache-2.0"

# Noto Sans, embedded in the PDFs of the print templates; unmodified, from github.com/notofonts.
[[annotations]]
path = [
  "backend/dx-engine/src/main/resources/fonts/NotoSans-Regular.ttf",
  "backend/dx-engine/src/main/resources/fonts/NotoSans-Bold.ttf",
]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The license and notice texts of the libraries in the images, collected by .github/scripts/check_third_party_notices.py;
# a text may quote an SPDX line of its own project, which is not a license of the file.
[[annotations]]
path = ["backend/licenses/THIRD-PARTY-LICENSES-*.txt", "sso/licenses/THIRD-PARTY-LICENSES-*.txt", "clamav/licenses/THIRD-PARTY-LICENSES-*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 HaUI-ImplSolution"
SPDX-License-Identifier = "Apache-2.0"
