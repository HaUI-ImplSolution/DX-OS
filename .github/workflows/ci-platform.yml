# SPDX-License-Identifier: Apache-2.0
name: Platform

# Checks that need the stack: the Compose file and gateway, the installer and the backup, the API and the web console
# running together on an empty stack, the API alone in core mode, and what the gateway shows of tier 1.
on:
  push:
    branches:
      - main
      - Khuong/main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compose:
    name: Validate the Compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill every blank variable of .env.example with a placeholder
        run: sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' deploy/.env.example > deploy/.env

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Compose must stop when a secret is missing
        run: |
          sed -E 's/^(KEYCLOAK_DB_PASSWORD)=.*$/\1=/' deploy/.env > deploy/.env.missing
          if docker compose --env-file deploy/.env.missing -f deploy/docker-compose.yml config --quiet 2> compose-error.log; then
            echo "compose accepted an empty KEYCLOAK_DB_PASSWORD"; exit 1
          fi
          grep -q KEYCLOAK_DB_PASSWORD compose-error.log

  gateway:
    name: Validate the gateway routes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the core routes and the installation example
        run: |
          for mode in full core; do
            for admin in false true; do
              args=(--mode "$mode")
              if [[ "$admin" == true ]]; then args+=(--admin-console); fi
              python3 e2e/api/check_routes.py "${args[@]}"
              python3 e2e/api/check_routes.py "${args[@]}" --local deploy/apisix/local.example.yaml
            done
          done

      - name: Invalid installation routes are refused
        run: |
          python3 - <<'PYTHON'
          import copy
          import json
          import pathlib
          import subprocess
          import tempfile

          base = {"routes": [{"id": "extension", "uri": "/extensions/example/*",
                              "upstream_id": "backend", "plugin_config_id": "bearer-token"}]}
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / "local.yaml"
              for change in ({"id": "api"}, {"uri": "/api/private"},
                             {"upstream_id": "missing"}, {"plugin_config_id": "missing"},
                             {"methods": ["INVALID"]}, {"plugin_config_id": None}):
                  local = copy.deepcopy(base)
                  for key, value in change.items():
                      if value is None:
                          local["routes"][0].pop(key, None)
                      else:
                          local["routes"][0][key] = value
                  path.write_text(json.dumps(local))
                  result = subprocess.run(["python3", "e2e/api/check_routes.py", "--local", str(path)])
                  assert result.returncode != 0, f"accepted invalid installation route: {change}"
          PYTHON

  install:
    name: Install from the release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install a release archive of this commit with the installer of the releases
        run: |
          git archive --format=tar.gz --prefix=dx-os-0.0.0/ -o "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" HEAD
          (cd "$RUNNER_TEMP" && sha256sum dx-os-0.0.0.tar.gz > dx-os-0.0.0.sha256)
          bash deploy/get.sh --file "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" --prefix "$RUNNER_TEMP/dx-os"
          grep -qx 'DXOS_IMAGE_TAG=v0.0.0' "$RUNNER_TEMP/dx-os/deploy/.env"
          grep -qx 'COMPOSE_PROJECT_NAME=dxos' "$RUNNER_TEMP/dx-os/deploy/.env"
          "$HOME/.local/bin/dxos" version
          "$HOME/.local/bin/dxos" help > /dev/null

      - name: The archive passes the checks of the release workflow
        run: .github/scripts/check_archive.sh "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" 0.0.0

      - name: Upgrade preserves installation routes outside the runtime manifest
        run: |
          prefix="$RUNNER_TEMP/dx-os"
          printf 'routes: []\n' > "$RUNNER_TEMP/local.yaml"
          cp "$RUNNER_TEMP/local.yaml" "$prefix/deploy/apisix/local.yaml"
          echo deploy/apisix/local.yaml >> "$prefix/.dxos-files"
          bash deploy/get.sh --upgrade --file "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" --prefix "$prefix"
          cmp "$RUNNER_TEMP/local.yaml" "$prefix/deploy/apisix/local.yaml"
          if grep -qx deploy/apisix/local.yaml "$prefix/.dxos-files"; then
            echo "installation routes must not be managed runtime files"; exit 1
          fi
          test -f "$prefix/deploy/apisix/render.lua"
          test -f "$prefix/deploy/apisix/local.example.yaml"

      - name: A changed archive is refused
        run: |
          echo tampered >> "$RUNNER_TEMP/dx-os-0.0.0.tar.gz"
          if bash deploy/get.sh --file "$RUNNER_TEMP/dx-os-0.0.0.tar.gz" --prefix "$RUNNER_TEMP/other"; then
            echo "the installer accepted an archive that does not match its SHA-256"; exit 1
          fi

      - name: Compose resolves there and every file it mounts was copied
        working-directory: ${{ runner.temp }}/dx-os/deploy
        run: |
          docker compose config --quiet
          docker compose config --format json \
            | jq -r '.services[].volumes[]? | select(.type == "bind") | .source' | sort -u \
            | while read -r source; do
                # deploy/data holds runtime state that Compose creates on first start.
                case "$source" in "$PWD"/data|"$PWD"/data/*) continue ;; esac
                [[ -e "$source" ]] || { echo "not installed: $source"; exit 1; }
              done

  backup:
    name: Back up and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create an env file with random secrets
        run: deploy/make_env.sh deploy/.env

      - name: Leave the virus scan out
        run: sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=app/; s/^STORAGE_SCAN_HOST=.*/STORAGE_SCAN_HOST=/' deploy/.env

      - name: Start Postgres and SeaweedFS and put some data in them
        working-directory: deploy
        run: |
          # Made before Compose creates deploy/data as root through the Postgres bind mount.
          mkdir -p data/seaweedfs
          docker compose up -d --wait postgres seaweedfs
          docker compose exec -T postgres psql -U dxos -d dxos -c "CREATE TABLE backup_drill (id int); INSERT INTO backup_drill VALUES (1)"
          # One applied model with its records and one attachment, as the engine keeps them.
          docker compose exec -T postgres psql -U dxos -d dxos -v ON_ERROR_STOP=1 -c "
            CREATE SCHEMA engine; CREATE TABLE engine.model_version (model text);
            INSERT INTO engine.model_version VALUES ('drill');
            CREATE SCHEMA m_drill; CREATE TABLE m_drill.item (id int); INSERT INTO m_drill.item VALUES (1), (2);
            CREATE TABLE engine.attachment (id serial PRIMARY KEY, object_key text);
            INSERT INTO engine.attachment (object_key) VALUES ('drill.pdf')"
          bucket="$(grep -E '^S3_BUCKET=' .env | cut -d= -f2-)"
          docker compose exec -T seaweedfs sh -c '
            s3() { curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" "$@"; }
            s3 -X PUT "http://127.0.0.1:8333/'"$bucket"'"
            echo "%PDF-1.4 drill" > /tmp/drill.pdf
            s3 -T /tmp/drill.pdf "http://127.0.0.1:8333/'"$bucket"'/drill.pdf"'

      - name: Back up
        working-directory: deploy
        run: ./backup.sh

      - name: Restore the backup into a scratch Postgres and SeaweedFS and check it
        working-directory: deploy
        run: |
          ./backup.sh verify | tee verify.log
          grep -q "Applied models: 1, records in their tables: 2" verify.log
          grep -q "Attachments: 1, files missing from the copy of the store: 0" verify.log

      - name: An attachment without its file fails the check
        working-directory: deploy
        run: |
          docker compose exec -T postgres psql -U dxos -d dxos -c "INSERT INTO engine.attachment (object_key) VALUES ('gone.pdf')"
          ./backup.sh
          if ./backup.sh verify > verify-missing.log 2>&1; then
            cat verify-missing.log; echo "verify passed with a file missing from the store"; exit 1
          fi
          grep -q "files missing for attachments: gone.pdf" verify-missing.log

      - name: A backup slower than the delay of file deletion warns
        working-directory: deploy
        run: |
          echo "DXOS_FILE_DELETE_DELAY=0s" >> .env
          ./backup.sh 2>&1 | tee warn.log
          grep -q "WARNING: the dump and the copy of the store took" warn.log

  api-e2e:
    name: "API end-to-end (${{ matrix.group }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each group runs on its own empty stack; the scripts of a group depend only on the ones before them in it.
          - group: model and process
            checks: api recovery case change process booking documents codes demo guards users docs conformance cli browser
          - group: events and bootstrap
            checks: events bootstrap
          # Core mode runs tier 1 only: no web app, portal or monitor.
          - group: core mode
            mode: core
            checks: api recovery case change process booking documents codes demo guards users docs conformance cli browser
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create an env file with random secrets
        run: deploy/make_env.sh deploy/.env

      # Only the core mode run of the API end-to-end job keeps the scan: ClamAV needs about 1 GB and the other runs do not test it.
      - name: Leave the virus scan out
        if: matrix.mode != 'core'
        run: sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=app/; s/^STORAGE_SCAN_HOST=.*/STORAGE_SCAN_HOST=/' deploy/.env

      # The scripts reach the Keycloak Admin API through the gateway, which closes /admin by default.
      - name: Open the Keycloak Admin Console for the scripts
        run: sed -i 's/^KEYCLOAK_ADMIN_CONSOLE=.*/KEYCLOAK_ADMIN_CONSOLE=true/' deploy/.env

      - name: Run core mode
        if: matrix.mode == 'core'
        run: sed -i 's/^DXOS_MODE=.*/DXOS_MODE=core/; s/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=av/' deploy/.env

      - name: Build the images of this commit
        working-directory: deploy
        run: docker compose build

      - name: Start an empty stack
        working-directory: deploy
        run: |
          docker compose up -d
          ready=false
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:9080/api/v1/system/status > /dev/null; then ready=true; break; fi
            sleep 5
          done
          $ready || { docker compose ps; exit 1; }
          # ClamAV loads its signatures after the backend is up, and uploads are refused until it answers.
          if [ -n "$(docker compose ps -q clamav)" ]; then docker compose up -d --wait --wait-timeout 300 clamav; fi

      - name: Run the checks in the order of docs/TESTING.md
        env:
          # The core mode run keeps the virus scan, so its stack must have it.
          DXOS_REQUIRE_SCAN: ${{ matrix.mode == 'core' && '1' || '' }}
        run: |
          for check in ${{ matrix.checks }}; do
            echo "::group::check_$check.py"
            started=$SECONDS
            python3 "e2e/api/check_$check.py"
            echo "check_$check.py took $((SECONDS - started)) s"
            echo "::endgroup::"
            echo "check_$check.py: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Memory of each container after the checks
        if: always()
        run: |
          {
            echo "### Memory after the checks (${{ matrix.group }})"
            echo
            echo "| Container | Memory |"
            echo "|---|---|"
            docker stats --no-stream --format '{{.Name}}|{{.MemUsage}}' | sort | awk -F'|' '{printf "| %s | %s |\n", $1, $2}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs of the services
        if: failure()
        working-directory: deploy
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/compose.log"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-e2e-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/compose.log

  gateway-surface:
    name: "Gateway surface (${{ matrix.mode }} mode)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [full, core]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create an env file with random secrets
        run: deploy/make_env.sh deploy/.env

      - name: Leave the virus scan out
        run: sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=app/; s/^STORAGE_SCAN_HOST=.*/STORAGE_SCAN_HOST=/' deploy/.env

      - name: Run core mode
        if: matrix.mode == 'core'
        run: sed -i 's/^DXOS_MODE=.*/DXOS_MODE=core/; s/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' deploy/.env

      - name: Build the images of this commit
        working-directory: deploy
        run: docker compose build

      - name: Start an empty stack
        working-directory: deploy
        run: |
          docker compose up -d
          for _ in $(seq 1 90); do
            curl -sf http://localhost:9080/api/v1/system/status > /dev/null && exit 0
            sleep 5
          done
          docker compose ps; exit 1

      - name: The default install serves no Swagger UI and no Admin Console
        run: python3 e2e/api/check_surface.py

      - name: KEYCLOAK_ADMIN_CONSOLE=true opens the Admin Console
        working-directory: deploy
        run: |
          sed -i 's/^KEYCLOAK_ADMIN_CONSOLE=.*/KEYCLOAK_ADMIN_CONSOLE=true/' .env
          docker compose up -d apisix-config
          docker compose restart apisix
          sleep 10
          python3 ../e2e/api/check_surface.py

      - name: Logs of the services
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --timestamps --tail=300 | tail -n 400

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/web/package-lock.json

      - name: Create an env file with random secrets
        run: deploy/make_env.sh deploy/.env

      - name: Leave the virus scan out
        run: sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=app/; s/^STORAGE_SCAN_HOST=.*/STORAGE_SCAN_HOST=/' deploy/.env

      # The script that creates the account reaches the Keycloak Admin API through the gateway, which closes /admin by default.
      - name: Open the Keycloak Admin Console for the script
        run: sed -i 's/^KEYCLOAK_ADMIN_CONSOLE=.*/KEYCLOAK_ADMIN_CONSOLE=true/' deploy/.env

      - name: Build the images of this commit
        working-directory: deploy
        run: docker compose build

      - name: Start an empty stack
        working-directory: deploy
        run: |
          docker compose up -d
          for _ in $(seq 1 90); do
            curl -sf http://localhost:9080/api/v1/system/status > /dev/null && exit 0
            sleep 5
          done
          docker compose ps; exit 1

      - name: Create the account the browser signs in with
        run: python3 -c "import sys; sys.path.insert(0, 'e2e/api'); import kc; kc.ensure_user('ui_admin', ['ADMIN'])"

      - name: Install the browser
        working-directory: e2e/web
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          # The apt mirror of the runner is sometimes unreachable. Try the full install three times, then
          # install the browser alone: the runner image already holds the libraries it needs.
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          npx playwright install chromium

      - name: Sign in, apply a template and walk through the console
        working-directory: e2e/web
        run: npx playwright test

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-screenshots-${{ github.run_attempt }}
          path: e2e/web/screenshots
          if-no-files-found: ignore

      - name: Keep the trace of a failed test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-trace-${{ github.run_attempt }}
          path: e2e/web/test-results
          if-no-files-found: ignore

      - name: Logs of the services
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --timestamps --tail=300 | tail -n 400
