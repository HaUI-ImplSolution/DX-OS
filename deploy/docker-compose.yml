# SPDX-License-Identifier: Apache-2.0
# DX-OS stack: the shared core and the model-driven service.
# Every ${VAR:?} must be set in deploy/.env (copy .env.example); Compose stops and names the
# missing variable.
# Published ports: the gateway (apisix) and Postgres.
# Everything else is reached through the gateway.

# Rotates the container logs so they cannot fill the disk; `docker compose logs` reads them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# For containers that run as a normal user and need no Linux capability: nothing can gain more
# privileges than it started with.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

services:
  # ---------------------------------------------------------------------------
  # Data and storage
  # ---------------------------------------------------------------------------
  postgres:
    logging: *default-logging
    # The bookworm variant keeps the C library of existing data directories; the default tag uses a newer one and reports a collation mismatch on them.
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    environment:
      <<: *postgres-env
      # Password of the Keycloak role, created by postgres/init when the data directory is new.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - ${POSTGRES_DATA_DIR:?}:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object store for photos and attachments (SeaweedFS). Master, volume server, filer
  # and S3 gateway run in one process; the filer has no HTTP interface, so objects are reachable
  # only through the S3 API with the keys below.
  seaweedfs:
    logging: *default-logging
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    # -v=-1 logs warnings and errors only, leaving out the lock ring's info lines every 30 seconds;
    # -v=0 shows info logs.
    command: ["-logtostderr=true", "-v=-1", "server", "-ip=seaweedfs", "-dir=/data", "-s3",
      "-filer.disableHttp", "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      # Filer gRPC (user and policy management, S3 STS) accepts only callers signed with this key.
      WEED_JWT_FILER_SIGNING_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - ./data/seaweedfs:/data
    # No published port: photos are read through presigned links, the admin page through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Backend, web and portal
  # ---------------------------------------------------------------------------
  backend:
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-backend:${DXOS_IMAGE_TAG:-local}
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      # The model files of dxos start <file>...; the backend applies each on start when it is new.
      - ./model:/models:ro
      # Webhook targets that models name in their file; targets.yml stays out of git
      - ./webhooks:/webhooks:ro
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_PORT: 8081
      ENGINE_MODEL_DIR: /models
      ENGINE_MODEL_FILE: ${DXOS_MODEL_FILE:-}
      # Webhook for the history lines of records; a model that names no target uses this one and
      # empty sends nothing
      ENGINE_WEBHOOK_FILE: /webhooks/targets.yml
      ENGINE_WEBHOOK_URL: ${DXOS_WEBHOOK_URL:-}
      ENGINE_WEBHOOK_SECRET: ${DXOS_WEBHOOK_SECRET:-}
      ENGINE_WEBHOOK_FORMAT: ${DXOS_WEBHOOK_FORMAT:-json}
      # Tries of an outbox message before it stops and waits for a retry in the console
      ENGINE_OUTBOX_MAX_ATTEMPTS: ${DXOS_OUTBOX_MAX_ATTEMPTS:-20}
      # Milliseconds between two looks at the outbox and between two sweeps for overdue records
      ENGINE_OUTBOX_POLL_MS: ${DXOS_OUTBOX_POLL_MS:-2000}
      ENGINE_OVERDUE_SWEEP_MS: ${DXOS_OVERDUE_SWEEP_MS:-60000}
      # How long before its deadline a record gets a due_soon line; a deadline not longer than this gets none
      ENGINE_DUE_SOON_BEFORE: ${DXOS_DUE_SOON_BEFORE:-24h}
      # File storage
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      STORAGE_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-15m}
      # Wait before the object of a removed file is deleted; a backup shorter than this has every file
      ENGINE_FILES_DELETE_DELAY: ${DXOS_FILE_DELETE_DELAY:-24h}
      # Keycloak admin client (creates the client and roles of a model, manages users)
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      # Virus scan of uploads: the host of clamd (service clamav, profile av); empty turns it off
      STORAGE_SCAN_HOST: ${STORAGE_SCAN_HOST:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Password of the user "metrics" that scrapes /actuator/prometheus on the internal network only; empty closes it
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      # Milliseconds between two counts of the numbers /actuator/prometheus serves
      METRICS_REFRESH_MS: ${METRICS_REFRESH_MS:-30000}
      # Exact browser origins allowed to call the API; the backend refuses unsafe values.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Password of the read-only role for reports, created when a model is applied
      ENGINE_REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?}
      # Test only: fails a decision after the process step, to show both changes roll back
      ENGINE_FAULT_AFTER_DECISION: ${ENGINE_FAULT_AFTER_DECISION:-false}
      # Test only: fails the apply step of this kind, to show an apply that stops halfway
      ENGINE_FAULT_APPLY_STEP: ${ENGINE_FAULT_APPLY_STEP:-}
    # No published port: clients reach the API through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Tier 2 (frontend, portal, monitor-init, monitor) is the profile app: DXOS_MODE=core leaves it out of COMPOSE_PROFILES.
  frontend:
    profiles:
      - app
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-frontend:${DXOS_IMAGE_TAG:-local}
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Served by the gateway on the same origin as the API and Keycloak, so both stay empty.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: ""
        VITE_KEYCLOAK_CLIENT_ID: dxos-web
    depends_on:
      - backend
    # No published port: the gateway serves the web app.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  portal:
    profiles:
      - app
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-portal:${DXOS_IMAGE_TAG:-local}
    restart: unless-stopped
    build:
      context: ../portal
      dockerfile: Dockerfile
    # No published port: the gateway serves the portal under /portal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Virus scan of every upload before it is stored (about 1 GB of RAM). It runs with av in COMPOSE_PROFILES and
  # STORAGE_SCAN_HOST=clamav in deploy/.env, which is how .env.example ships (dxos av off removes both). The signatures are kept
  # in a volume, and clamd answers no scan for about 10 seconds each time it reloads them.
  clamav:
    profiles:
      - av
    logging: *default-logging
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    restart: unless-stopped
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_TemporaryDirectory: /tmp
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - clamav_data:/var/lib/clamav
    # No published port: only the backend reaches clamd.

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  keycloak:
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-sso:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../sso
      dockerfile: Dockerfile
    command: ["start-dev", "--import-realm"]
    # With KEYCLOAK_HOSTNAME set, Keycloak gives browsers that address and keeps the internal address
    # for the gateway and the backend; both options are set together because either one alone breaks it.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -z "$$KEYCLOAK_HOSTNAME" ] || export KC_HOSTNAME="$$KEYCLOAK_HOSTNAME" KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true; exec /opt/keycloak/bin/kc.sh "$$@"'
      - kc
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      # Keycloak 26.8 listens on localhost only unless told otherwise; the gateway reaches it over the compose network.
      KC_HTTP_HOST: 0.0.0.0
      # Substituted into the placeholders of realm-dxos.json at import time.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      DXOS_CLI_SECRET: ${DXOS_CLI_SECRET:?}
      STAFF_OTP_FLOW: ${STAFF_OTP_FLOW:-DISABLED}
    volumes:
      - ../sso/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
    # No published port: the gateway routes /realms, /resources and /admin to it.
    # The health endpoint is probed over bash on the management port.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  # Creates the Postgres roles and schema of the monitoring service and the view of Keycloak
  # sign-in events it reads (idempotent, see monitor-init.sh). It waits for the backend (audit_log)
  # and Keycloak (event_entity) because each creates its own tables.
  monitor-init:
    profiles:
      - app
    logging: *default-logging
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
    volumes:
      - ./postgres/monitor-init.sh:/monitor-init.sh:ro
    entrypoint: ["bash", "/monitor-init.sh"]

  # Receives the unusual requests of the gateway, probes the services and serves the screen of
  # administrators under /monitor. It runs apart from the backend so it works when the backend is down.
  monitor:
    profiles:
      - app
    <<: *hardened
    logging: *default-logging
    image: ${DXOS_IMAGE_PREFIX:-dxos}-monitor:${DXOS_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: monitor
    restart: unless-stopped
    depends_on:
      monitor-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
      KEYCLOAK_READONLY_DB_PASSWORD: ${KEYCLOAK_READONLY_DB_PASSWORD:?}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
      MONITOR_OIDC_CLIENT_SECRET: ${MONITOR_OIDC_CLIENT_SECRET:?}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      # Alerts go to the administrators' channel when a webhook is set.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL_ADMIN: ${ALERT_WEBHOOK_URL_ADMIN:-}
    # No published port: the gateway forwards /monitor, and delivers its own events straight to it.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/monitor/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------------------------
  # Validates and merges the core routes and optional installation routes.
  apisix-config:
    image: apache/apisix:3.11.0-debian@sha256:178d1f79c2c39834f50213bf6ace90284f6b985dc8189cc50f3666d9fb1037ad
    user: root
    network_mode: none
    environment:
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:?}
      DXOS_MODE: ${DXOS_MODE:-full}
      KEYCLOAK_ADMIN_CONSOLE: ${KEYCLOAK_ADMIN_CONSOLE:-false}
    entrypoint: ["/usr/local/openresty/bin/resty", "--errlog-level", "error", "-I", "/usr/local/apisix", "-I", "/usr/local/apisix/deps/share/lua/5.1", "-I", "/usr/local/apisix/deps/lib/lua/5.1", "/src/render.lua"]
    command:
      - --output
      - /out/apisix.yaml
    volumes:
      - ./apisix:/src:ro
      - ./data/apisix:/out

  apisix:
    # The access log is the traffic record, so it keeps more history than the other services.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: apache/apisix:3.11.0-debian@sha256:178d1f79c2c39834f50213bf6ace90284f6b985dc8189cc50f3666d9fb1037ad
    entrypoint: ["/bin/sh", "/dxos-apisix-entrypoint.sh"]
    command: ["docker-start"]
    restart: unless-stopped
    depends_on:
      apisix-config:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      frontend:
        condition: service_healthy
        required: false
      portal:
        condition: service_healthy
        required: false
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/entrypoint.sh:/dxos-apisix-entrypoint.sh:ro
      - ./data/apisix:/usr/local/apisix/generated:ro
    ports:
      - "${APISIX_HOST_PORT:?}:9080"
    healthcheck:
      # The image has no curl; any answer below 500 on the web route means the gateway serves.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET / HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -qE 'HTTP/1\.[01] [234]'
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  clamav_data:
