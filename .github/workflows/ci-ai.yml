name: CI AI
on:
  push:
    branches:
      - main
      - Khuong/main
    paths:
      - 'ai/**'
      - 'data/**'
      - 'backend/app-farm/src/main/resources/farm/data.sql'
      - 'backend/app-farm/src/main/resources/knowledge-sources.json'
      - 'backend/app-lab/src/main/resources/lab/knowledge-sources.json'
      - '.github/workflows/ci-ai.yml'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main
    paths:
      - 'ai/**'
      - 'data/**'
      - 'backend/app-farm/src/main/resources/farm/data.sql'
      - 'backend/app-farm/src/main/resources/knowledge-sources.json'
      - 'backend/app-lab/src/main/resources/lab/knowledge-sources.json'
      - '.github/workflows/ci-ai.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements*.txt

      - name: Verify generated backend seed
        working-directory: .
        run: |
          python data/scripts/generate_seed_sql.py --check
          python -m unittest data.scripts.test_generate_seed_sql data.scripts.test_knowledge_sources

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
