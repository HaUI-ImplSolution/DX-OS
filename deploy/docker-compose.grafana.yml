# Optional Prometheus and Grafana for the dxos_* metrics of the core, loaded only when deploy/.env sets
# COMPOSE_FILE=docker-compose.yml:docker-compose.grafana.yml (see docs/MONITORING.md).
# Its settings are in deploy/grafana.env (copy grafana.env.example), never in deploy/.env;
# the one value it reads from deploy/.env is METRICS_PASSWORD, the password of the metrics endpoint.
# Grafana is published on 127.0.0.1 only; GRAFANA_BIND in deploy/.env changes that, and then the traffic
# should run over a VPN or a TLS proxy, because Grafana serves plain HTTP. Prometheus is not published.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    <<: *hardened
    logging: *default-logging
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    entrypoint: [sh, -c]
    command:
      - |
        [ -n "$$METRICS_PASSWORD" ] || { echo "METRICS_PASSWORD is empty in deploy/.env; the metrics endpoint is closed without it" >&2; exit 1; }
        printf '%s' "$$METRICS_PASSWORD" > /tmp/dxos-metrics-password
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=$$PROMETHEUS_RETENTION --web.listen-address=0.0.0.0:9090
    volumes:
      - prometheus_data:/prometheus
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=1m,uid=65534,gid=65534"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 4

  grafana:
    <<: *hardened
    logging: *default-logging
    image: grafana/grafana:12.4.15@sha256:2894082f6cf7081aefdc1389265c04000812309208c190d75e8c65f7a30e4b7e
    user: "472:472"
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - path: ./grafana.env
        required: false
    environment:
      GF_LOG_MODE: console
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    entrypoint: [sh, -c]
    command:
      - |
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GF_SECURITY_ADMIN_PASSWORD is empty in deploy/grafana.env" >&2; exit 1; }
        exec /run.sh
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,uid=472,gid=472"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
