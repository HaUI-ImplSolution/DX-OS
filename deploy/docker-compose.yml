# Mọi biến ${...} trong file này bắt buộc khai báo trong deploy/.env (copy từ .env.example);
# thiếu biến nào Compose dừng và báo đúng tên biến đó.

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

x-ai-build: &ai-build
  context: ../ai
  dockerfile: Dockerfile

x-ai-common-env: &ai-common-env
  EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:?}
  HF_HOME: /app/weights/huggingface

x-mattermost-volumes: &mattermost-volumes
  - ./data/mattermost/config:/mattermost/config
  - ./data/mattermost/data:/mattermost/data
  - ./data/mattermost/logs:/mattermost/logs
  - ./data/mattermost/plugins:/mattermost/plugins
  - ./data/mattermost/client-plugins:/mattermost/client/plugins
  - ./data/mattermost/bleve-indexes:/mattermost/bleve-indexes

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      <<: *postgres-env
    volumes:
      - ${POSTGRES_DATA_DIR:?}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SERVER_PORT: 8081
      DXOS_APP: ${DXOS_APP:-farm}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:?}
      STORAGE_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      SUPERSET_RO_PASSWORD: ${SUPERSET_READONLY_DB_PASSWORD:?}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      AI_VECTOR_DB_RO_PASSWORD: ${AI_VECTOR_DB_READONLY_PASSWORD:?}
      AI_VECTOR_DB_INGEST_PASSWORD: ${AI_VECTOR_DB_INGEST_PASSWORD:?}
      AI_SERVICE_BASE_URL: ${AI_BASE_URL:?}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:?}
      AI_SERVICE_CONNECT_TIMEOUT_MS: ${BACKEND_TO_AI_CONNECT_TIMEOUT_MS:?}
      AI_SERVICE_READ_TIMEOUT_MS: ${BACKEND_TO_AI_READ_TIMEOUT_MS:?}
      AI_SERVICE_INBOUND_API_KEY: ${AI_TO_BACKEND_API_KEY:?}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      MATTERMOST_WEBHOOK_URL_ADMIN: ${MATTERMOST_WEBHOOK_URL_ADMIN:-}
      MATTERMOST_WEBHOOK_URL_ENGINEER: ${MATTERMOST_WEBHOOK_URL_ENGINEER:-}
      MATTERMOST_IMAGE_BASE_URL: ${MATTERMOST_IMAGE_BASE_URL:-}
      HTX_CODE: ${HTX_CODE:-HTX01}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.open-meteo.com}
    # No published port: clients reach the API through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Official MinIO images are no longer published, so the image is built from the upstream source.
  minio:
    build:
      context: ../minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes:
      - ./data/minio:/data
    # No published port: photos are read through presigned links and the console through the gateway.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  apisix:
    image: apache/apisix:3.11.0-debian
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      frontend:
        condition: service_healthy
      superset:
        condition: service_healthy
      portal:
        condition: service_healthy
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_HOST_PORT:?}:9080"
      - "${APISIX_SUPERSET_HOST_PORT:?}:9081"
      - "${APISIX_MINIO_HOST_PORT:?}:9082"
    healthcheck:
      # The APISIX image has no curl; any answer below 500 on the web route means the gateway serves.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET / HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -qE 'HTTP/1\.[01] [234]'
      interval: 10s
      timeout: 5s
      retries: 6

  ollama:
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:?}"]

  ai:
    build:
      <<: *ai-build
    depends_on:
      rag-ingest:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      <<: *ai-common-env
      # Role/database dx_farm_ai_vector_db do backend tự tạo lúc khởi động (AiVectorDatabaseSeeder) -
      # chỉ chứa documents/document_chunks, tách biệt hoàn toàn khỏi CSDL nghiệp vụ của Backend.
      DATABASE_URL: postgresql+psycopg://ai_vector_ro:${AI_VECTOR_DB_READONLY_PASSWORD:?}@postgres:5432/dx_farm_ai_vector_db
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?}
      BACKEND_SERVICE_API_KEY: ${AI_TO_BACKEND_API_KEY:?}
      AI_SERVICE_API_KEY: ${BACKEND_TO_AI_API_KEY:?}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?}
      CV_DEVICE: ${AI_CV_DEVICE:?}
      CV_WEIGHTS_SHA256: ${AI_CV_WEIGHTS_SHA256:?}
      LOG_LEVEL: ${AI_LOG_LEVEL:?}
    volumes:
      - ${AI_DATA_DIR:?}:/data:ro
      - ai_weights:/app/weights
      - type: bind
        source: ${AI_CV_WEIGHTS_PATH:-../ai/weights/best.pt}
        target: /app/weights/best.pt
        read_only: true
        bind:
          # Fail clearly instead of letting Docker create a root-owned directory
          # when a machine-specific override points to a missing file.
          create_host_path: false
      - type: bind
        source: ${AI_CROP_CLASSIFIER_PATH:-../ai/weights/crop_classifier.onnx}
        target: /app/weights/crop_classifier.onnx
        read_only: true
        bind:
          create_host_path: false
    # No published port: only Backend (and AI-internal jobs) reach AI over the compose network.

  rag-ingest:
    build:
      <<: *ai-build
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *ai-common-env
      RAG_INGEST_DATABASE_URL: postgresql+psycopg://ai_vector_ingest:${AI_VECTOR_DB_INGEST_PASSWORD:?}@postgres:5432/dx_farm_ai_vector_db
    volumes:
      - ${AI_DATA_DIR:?}:/data:ro
      - ai_weights:/app/weights
    command: ["python", "-m", "scripts.ingest_diseases"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Served by the gateway on the same origin as the API and Keycloak, so both stay empty.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: ""
        VITE_KEYCLOAK_CLIENT_ID: dxfarm-frontend
    depends_on:
      - backend
    # No published port: the gateway serves the web app.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    # No published port: the gateway serves the portal under /portal.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Healthcheck của backend chỉ xác nhận app đã lên, không đảm bảo role/database do các
    # CommandLineRunner seeder tạo xong (Tomcat nhận request trước khi seeder chạy xong) -
    # tự thử lại nếu lần đầu connect Postgres thất bại.
    restart: on-failure
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      # Substituted into realm-dxfarm.json (${SUPERSET_OIDC_CLIENT_SECRET}) at import time.
      SUPERSET_OIDC_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
    volumes:
      - ../sso/realm-dxfarm.json:/opt/keycloak/data/import/realm-dxfarm.json:ro
    # No published port: the gateway routes /realms, /resources and /admin to it.
    # The Keycloak image has no curl; probe the management port (KC_HEALTH_ENABLED) over bash.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Superset chạy bằng uid 1000 nhưng bind mount mới tạo thuộc root - chown một lần trước khi Superset khởi động.
  superset-init:
    image: alpine:3.20
    command: ["chown", "-R", "1000:1000", "/app/superset_home"]
    volumes:
      - ./data/superset:/app/superset_home

  superset:
    image: apache/superset:3.1.3
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?}
      DXFARM_DB_URI: postgresql+psycopg2://superset_ro:${SUPERSET_READONLY_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:?}
      KEYCLOAK_SUPERSET_CLIENT_ID: ${SUPERSET_OIDC_CLIENT_ID:?}
      KEYCLOAK_SUPERSET_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET:?}
    volumes:
      - ../bi/bootstrap.sh:/app/pythonpath/bootstrap.sh:ro
      - ../bi/bootstrap_datasources.py:/app/pythonpath/bootstrap_datasources.py:ro
      - ../bi/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../bi/dxfarm_dashboard_export.zip:/app/pythonpath/dxfarm_dashboard_export.zip:ro
      - ./data/superset:/app/superset_home
    entrypoint: ["/bin/bash", "/app/pythonpath/bootstrap.sh"]
    # No published port: the gateway forwards its second listener (APISIX_SUPERSET_HOST_PORT) here.

  # Container Mattermost chạy bằng user không phải root (uid 2000) nhưng bind mount mới tạo lần
  # đầu thuộc root — service tạm này chown lại một lần trước khi Mattermost khởi động, để
  # `docker compose up` chạy được ngay không cần thao tác tay.
  mattermost-init:
    image: alpine:3.20
    command:
      ["chown", "-R", "2000:2000", "/mattermost/config", "/mattermost/data", "/mattermost/logs",
        "/mattermost/plugins", "/mattermost/client/plugins", "/mattermost/bleve-indexes"]
    volumes: *mattermost-volumes

  mattermost:
    image: mattermost/mattermost-team-edition:10.5
    # `depends_on: backend` (service_healthy) chỉ đảm bảo app đã lên, không đảm bảo role/database
    # `mattermost` đã tạo xong (CommandLineRunner seeder chạy sau khi Tomcat đã nhận request) -
    # tự thử lại nếu lần đầu connect Postgres thất bại.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      mattermost-init:
        condition: service_completed_successfully
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost_app:${MATTERMOST_DB_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:${MATTERMOST_HOST_PORT:?}"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
    volumes: *mattermost-volumes
    ports:
      - "${MATTERMOST_HOST_PORT:?}:8065"

  # Tạo admin, team và channel mặc định một lần sau khi Mattermost lên (idempotent, xem chat/bootstrap.sh).
  mattermost-bootstrap:
    image: mattermost/mattermost-team-edition:10.5
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    restart: on-failure
    depends_on:
      mattermost:
        condition: service_started
    environment:
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_ADMIN_USERNAME: ${MATTERMOST_ADMIN_USERNAME:?}
      MATTERMOST_ADMIN_EMAIL: ${MATTERMOST_ADMIN_EMAIL:?}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD:?}
    volumes:
      - ../chat/bootstrap.sh:/bootstrap.sh:ro

volumes:
  ai_weights:
  ollama_models:
