# SPDX-License-Identifier: Apache-2.0
name: CI Backend
on:
  push:
    branches:
      - main
      - Khuong/main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - Khuong/main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Code Formatting
        run: mvn -T 2C --batch-mode formatter:validate

      # Persistence tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      - name: Build and Test
        run: mvn --batch-mode verify
